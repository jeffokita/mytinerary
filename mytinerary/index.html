/* ---------- Start from Gmail & Google Calendar ---------- */
// Calendar's "from Gmail" events carry flights and stays with exact times and addresses, so they lead.
// Gmail search is a backup for lodging that never reached the calendar.
const GMAIL_Q = 'newer_than:9m (category:reservations OR subject:("your trip" OR "your stay" OR "flight is booked" OR "reservation confirmed" OR "booking confirmation" OR itinerary OR "your reservation")) -category:promotions -category:social';
const TRAVEL_RE = /flight|trip|travel|vacation|holiday|hotel|stay at|airbnb|vrbo|check[- ]?in|reservation|train|ferry|cruise|out of office|ooo|pto|✈/i;
function localISO(d) { return isoDate(d) + "T" + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":00"; }
function decodeEntities(s) { const t = document.createElement("textarea"); t.innerHTML = String(s || ""); return t.value; }
function asObj(payload) { if (typeof payload === "string") { try { return JSON.parse(payload); } catch (e) { return {}; } } return payload || {}; }

function compactEvents(payload) {
  const evs = asObj(payload).events || [];
  return evs.filter(e => {
    if (e.eventType === "FROM_GMAIL") return true;
    const allDayMulti = e.start && e.start.date && e.end && e.end.date && (parseDate(e.end.date) - parseDate(e.start.date)) / 864e5 >= 2;
    return allDayMulti || TRAVEL_RE.test((e.summary || "") + " " + (e.location || ""));
  }).slice(0, 120).map(e => ({
    title: e.summary || "", start: (e.start && (e.start.dateTime || e.start.date)) || "", end: (e.end && (e.end.dateTime || e.end.date)) || "",
    where: e.location || "", fromGmail: e.eventType === "FROM_GMAIL"
  }));
}
function compactThreads(payload) {
  const th = asObj(payload).threads || [];
  return th.slice(0, 30).map(t => {
    const m = (t.messages || [])[0] || {};
    const from = (m.addressDisplayNames && m.addressDisplayNames[0] && m.addressDisplayNames[0].displayName) || m.sender || "";
    return { id: t.id, date: (m.date || "").slice(0, 10), from, subject: decodeEntities(m.subject), snippet: decodeEntities(m.snippet).replace(/\s+/g, " ").slice(0, 180) };
  });
}
function connectorNote(server, e) {
  const c = e && e.code;
  if (HOSTED && (c === "not_connected" || c === "needs_reauth")) return "Google needs to be connected again. Click Connect Gmail & Calendar.";
  if (HOSTED && c === "not_in_manifest") return "Google didn't share " + server + ". Disconnect, connect again and tick both boxes.";
  if (c === "server_not_connected" || c === "server_not_found") return server + " isn't connected. Add it in claude.ai Settings → Connectors, then try again.";
  if (c === "needs_reauth") return server + " needs to be reconnected in claude.ai Settings → Connectors.";
  if (c === "not_in_manifest" || c === "approval_required") return "You didn't allow " + server + " for this page. Try again and choose Allow to include it.";
  if (c === "selection_required") return "You have more than one " + server + " connected. Choose one when claude.ai asks, then try again.";
  if (c === "blocked_by_policy") return "Your organization blocks " + server + " here.";
  if (c === "server_unavailable" || (e && e.retryable)) return server + " didn't respond. Try again in a minute.";
  if (c === "not_granted" || c === "capability_disabled") return "Connectors aren't available in this view.";
  return "Couldn't read " + server + ".";
}

function scanPrompt(events, threads) {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "local time";
  return "You find upcoming trips in a traveler's calendar and email for Mytinerary.\n" +
    "Today is " + isoDate(new Date()) + ". The traveler's time zone is " + tz + ". Only include trips that end on or after today.\n\n" +
    "CALENDAR EVENTS (next 12 months; timestamps carry their UTC offset; fromGmail events were created from booking emails)\n" +
    (events.length ? events.map(e => JSON.stringify(e)).join("\n") : "(none)") + "\n\n" +
    "EMAILS (recent travel-looking emails; ignore marketing, payments, newsletters and anything that isn't a booking)\n" +
    (threads.length ? threads.map(t => "[" + t.id + "] " + t.date + " · " + t.from + " · " + t.subject + " — " + t.snippet).join("\n") : "(none)") + "\n\n" +
    "Group related bookings into trips: an outbound flight, a stay and a return flight usually form one trip; layover cities are not destinations. " +
    "Infer the traveler's home city from where round trips start and end, and skip anything happening in the home city. A stay with no flights (a road trip) is still a trip.\n" +
    "startDate is the arrival date at the destination; endDate is the departure date. arriveTime and leaveTime are LOCAL times at the destination (convert using the offsets), or \"\" if unknown.\n" +
    "Do not include confirmation codes, prices or passenger details.\n" +
    "Reply with ONLY JSON:\n" +
    '{"homeCity":"","trips":[{"destination":"City, Country","startDate":"YYYY-MM-DD","endDate":"YYYY-MM-DD","arriveTime":"HH:MM","leaveTime":"HH:MM","summary":"one line","bookings":[{"type":"flight|lodging|car|train|restaurant|event|other","title":"short, e.g. DL 9576 Amsterdam → Lisbon","start":"YYYY-MM-DD HH:MM destination local","end":"","place":"","address":""}],"lodgingThreadIds":["email thread ids likely to hold lodging details missing from the calendar"]}]}\n' +
    "Order trips by startDate. Use an empty trips array when there are none.";
}

let scanRunning = false, autoTried = false;
async function scanTrips(auto) {
  if (scanRunning || !mcpApi || !sampleFn) return;
  scanRunning = true;
  S.scan = { state: "running", step: "Reading travel events from Google Calendar…", trips: [], notes: [], err: "", picking: null, homeCity: "", auto: !!auto };
  render();
  const now = new Date(), later = new Date(now.getFullYear() + 1, now.getMonth(), now.getDate());
  const cache = { staleTime: 30 * 60e3, gcTime: 24 * 3600e3 };
  let events = [], threads = [], okSources = 0;
  try {
    const r = await mcpApi.callTool("Google Calendar", "list_events", { startTime: localISO(now), endTime: localISO(later), eventType: ["FROM_GMAIL", "DEFAULT", "OUT_OF_OFFICE"], pageSize: 250, orderBy: "startTime" }, { cache });
    events = compactEvents(r.payload); okSources++;
  } catch (e) { S.scan.notes.push(connectorNote("Google Calendar", e)); }
  S.scan.step = "Looking for booking confirmations in Gmail…"; render();
  try {
    const r = await mcpApi.callTool("Gmail", "search_threads", { query: GMAIL_Q, pageSize: 30, view: "THREAD_VIEW_SUMMARY" }, { cache });
    threads = compactThreads(r.payload); okSources++;
  } catch (e) { S.scan.notes.push(connectorNote("Gmail", e)); }
  if (!okSources) { S.scan.state = "error"; S.scan.err = "Couldn't read Gmail or Google Calendar."; scanRunning = false; render(); return; }
  if (!events.length && !threads.length) { S.scan.state = "done"; scanRunning = false; render(); return; }
  S.scan.step = "Grouping " + (events.length + threads.length) + " bookings and events into trips…"; render();
  try {
    const res = await sampleFn.json(scanPrompt(events, threads), { modelTier: "default", cache: { gcTime: 12 * 3600e3 } });
    const today = isoDate(new Date());
    S.scan.homeCity = (res && res.homeCity) || "";
    S.scan.trips = ((res && res.trips) || []).filter(tr => tr && tr.destination && parseDate(tr.startDate) && parseDate(tr.endDate) && tr.endDate >= today).map(tr => ({
      id: uid(), destination: String(tr.destination), startDate: tr.startDate, endDate: tr.endDate,
      arriveTime: /^\d{1,2}:\d{2}$/.test(tr.arriveTime || "") ? tr.arriveTime.padStart(5, "0") : "",
      leaveTime: /^\d{1,2}:\d{2}$/.test(tr.leaveTime || "") ? tr.leaveTime.padStart(5, "0") : "",
      summary: tr.summary || "", bookings: Array.isArray(tr.bookings) ? tr.bookings.filter(b => b && b.title) : [],
      lodgingThreadIds: Array.isArray(tr.lodgingThreadIds) ? tr.lodgingThreadIds.slice(0, 2).map(String) : []
    }));
    S.scan.state = "done";
    saveFound(S.scan.trips); S.scan.trips = loadFound();
    if (!auto && okSources === 2) store("mytin.autoscan", true);
  } catch (e) {
    if (e && e.code === "not_granted") sampleBlocked = true;
    S.scan.state = "error"; S.scan.err = genErrorCopy(e);
  }
  scanRunning = false;
  render();
}
function maybeAutoScan() {
  if (HOSTED) return; // each scan costs a Claude call; on the hosted app it only runs when asked
  if (autoTried || !mcpApi || !sampleFn || !store("mytin.autoscan")) return;
  autoTried = true;
  scanTrips(true);
}
// Upcoming trips found in Gmail & Calendar, kept so the ones you didn't start are still there later.
const foundKey = tr => String(tr.destination).toLowerCase() + "|" + tr.startDate;
function loadFound() {
  const f = store("mytin.found") || {}, today = isoDate(new Date()), gone = new Set(f.dismissed || []);
  return (f.trips || []).filter(tr => tr.endDate >= today && !gone.has(foundKey(tr)));
}
function saveFound(trips) {
  const f = store("mytin.found") || {}, byKey = new Map((f.trips || []).map(tr => [foundKey(tr), tr]));
  trips.forEach(tr => byKey.set(foundKey(tr), Object.assign({}, byKey.get(foundKey(tr)), tr)));
  const today = isoDate(new Date());
  store("mytin.found", { trips: [...byKey.values()].filter(tr => tr.endDate >= today).sort((a, b) => a.startDate.localeCompare(b.startDate)).slice(0, 20), dismissed: (f.dismissed || []).slice(-50) });
}
function dismissFound(id) {
  const tr = S.scan.trips.find(x => x.id === id); if (!tr) return;
  const f = store("mytin.found") || {};
  store("mytin.found", Object.assign({}, f, { dismissed: (f.dismissed || []).concat(foundKey(tr)) }));
  S.scan.trips = S.scan.trips.filter(x => x.id !== id); render();
  toast("Hidden. It won't show up again.");
}
function hasSavedFor(tr) {
  const key = String(tr.destination).toLowerCase().split(/[ ,]/)[0];
  const scanKey = tr.destination + "|" + tr.startDate;
  return savedTrips().some(t => t.scanKey === scanKey || (t.startDate === tr.startDate && String(t.destination || "").toLowerCase().includes(key)));
}

async function startFromTrip(id) {
  const tr = S.scan.trips.find(x => x.id === id);
  if (!tr || S.scan.picking) return;
  const items = tr.bookings.slice();
  // Lodging that never reached the calendar: read up to two of the emails Claude flagged.
  if (!items.some(b => b.type === "lodging") && tr.lodgingThreadIds.length && mcpApi && sampleFn) {
    S.scan.picking = id; render();
    try {
      const texts = [];
      for (const tid of tr.lodgingThreadIds) {
        const r = await mcpApi.callTool("Gmail", "get_thread", { threadId: tid, messageFormat: "PLAIN_TEXT" });
        const msgs = asObj(r.payload).messages || [];
        texts.push(msgs.map(m => (m.subject || "") + "\n" + (m.plaintextBody || m.snippet || "")).join("\n---\n").slice(0, 5000));
      }
      const lod = await sampleFn.json("You extract lodging details from booking emails for Mytinerary.\nTrip: " + tr.destination + ", " + tr.startDate + " to " + tr.endDate +
        "\n\nEMAILS\n" + texts.join("\n=====\n") +
        '\n\nReply with ONLY JSON: {"found":true,"name":"","address":"","checkIn":"YYYY-MM-DD","checkOut":"YYYY-MM-DD","checkInTime":"HH:MM"} or {"found":false}. No confirmation codes or prices.', { modelTier: "quick" });
      if (lod && lod.found && lod.name) items.push({ type: "lodging", title: "Stay at " + lod.name, start: (lod.checkIn || tr.startDate) + (lod.checkInTime ? " " + lod.checkInTime : ""), end: lod.checkOut || tr.endDate, address: lod.address || "" });
    } catch (e) { /* Lodging stays unknown; the form still prefills. */ }
    S.scan.picking = null;
  }
  const a = parseDate(tr.startDate);
  let end = tr.endDate;
  const span = Math.round((parseDate(end) - a) / 864e5);
  if (span > 6) { const e2 = new Date(a); e2.setDate(a.getDate() + 6); end = isoDate(e2); }
  FORM = Object.assign({}, FORM, {
    dest: tr.destination, from: S.scan.homeCity || FORM.from, start: tr.startDate, end,
    arrive: tr.arriveTime, leave: span > 6 ? "" : tr.leaveTime,
    mustdo: "", notes: "",
    lodging: items.some(b => b.type === "lodging") ? "Hotel" : FORM.lodging,
    booked: { destination: tr.destination, startDate: tr.startDate, items },
    stay: (items.find(b => b.type === "lodging") || {}).title ? items.find(b => b.type === "lodging").title.replace(/^stay at\s+/i, "") : FORM.stay,
    prefill: { dest: tr.destination, fields: ["dest", "start", "end"].concat(tr.arriveTime ? ["arrive"] : [], tr.leaveTime && span <= 6 ? ["leave"] : [], items.some(b => b.type === "lodging") ? ["stay"] : []) }
  });
  store("mytin.form", FORM);

  return { gs, ge: Math.max(ge, gs + 360) };
}

/* Opening hours: Claude's typical weekly hours, e.g. {"mon":"closed","tue":"10:00-17:00,18:00-22:00"}. Unknown = no warning. */
function hoursOn(c, date) {
  const h = c.hours && c.hours[WD[parseDate(date).getDay()]];
  if (h == null || String(h).trim() === "") return null;
  if (/closed/i.test(h)) return [];
  const out = [];
  String(h).split(/[,;]/).forEach(r => {
    const m = /(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/.exec(r); if (!m) return;
    const a = toMin(m[1]); let b = toMin(m[2]); if (b <= a) b += 1440;
    out.push([a, b]);
  });
  return out.length ? out : null;
}
function openCheck(c, date, start) {
  const iv = hoursOn(c, date);
  if (!iv) return "";
  if (!iv.length) return "Usually closed on " + WD_NAME[WD[parseDate(date).getDay()]];
  const end = start + c.minutes;
  if (iv.some(([a, b]) => start >= a && end <= b)) return "";
  const cur = iv.find(([a, b]) => start >= a && start < b);
  if (cur) return "Usually closes at " + fmtShort(cur[1]);
  const later = iv.find(([a]) => a > start);
  if (later) return "Usually opens at " + fmtShort(later[0]);
  return "Usually closes at " + fmtShort(iv[iv.length - 1][1]);
}
function hoursSummary(c) {
  if (!c.hours) return "";
  const val = k => String(c.hours[k] || "").trim();
  if (WD_ORDER.every(k => !val(k))) return "";
  const closed = WD_ORDER.filter(k => /closed/i.test(val(k)));
  const open = WD_ORDER.map(val).filter(v => v && !/closed/i.test(v));
  const counts = {}; open.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  const main = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  const fmt = v => /^0?0:00\s*[-–]\s*24:00$/.test(v) ? "Open 24 hours" : v.split(/[,;]/).map(r => {
    const m = /(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/.exec(r); return m ? fmtShort(toMin(m[1])) + "–" + fmtShort(toMin(m[2])) : r.trim();
  }).join(", ");
  let s = main ? fmt(main) + (counts[main] < open.length ? " (varies)" : "") : "";
  if (closed.length) s += (s ? " · " : "") + "Closed " + closed.map(k => k[0].toUpperCase() + k.slice(1)).join(", ");
  return s;
}
// Problems with placing c on day di at start (minutes). buf pads the overlap check when auto-placing.
function issuesAt(c, di, start, buf) {
  const days = draftDays(), out = [], end = start + c.minutes;
  const oc = openCheck(c, days[di], start); if (oc) out.push(oc);
  const w = dayWindow(di, days.length);
  if (w.blockBefore != null && start < w.blockBefore) out.push("Before you'll be in town");
  if (w.blockAfter != null && end > w.blockAfter) out.push("Runs into your trip home");
  const clash = Object.keys(DRAFT.place).find(id => {
    const o = DRAFT.place[id], oc2 = candById(id);
    if (id === c.id || !oc2 || o.day !== di) return false;
    const os = toMin(o.start), oe = os + oc2.minutes;
    return start < oe + (buf || 0) && os < end + (buf || 0);
  });
  if (clash) out.push("Overlaps " + candById(clash).name);
  if (!c.fixed) { const rb = routineBlocks(di).find(r => start < r.b && r.a < end); if (rb) out.push("During " + rb.label.split(" ·")[0].toLowerCase()); }
  return out;
}

function normCand(c, mine) {
  const out = {
    id: uid(), name: String(c.name || "").trim(), category: CATS[c.category] ? c.category : "Experiences",
    neighborhood: String(c.neighborhood || ""), address: String(c.address || ""),
    lat: Number(c.lat), lng: Number(c.lng), why: String(c.why || ""), fitWhy: String(c.fitWhy || ""),
    fit: Math.max(0, Math.min(100, Math.round(Number(c.fit) || 0))),
    minutes: Math.max(30, Math.min(600, Math.round((Number(c.minutes) || 90) / SNAP) * SNAP)),
    bestTime: ["morning", "afternoon", "evening", "any"].includes(c.bestTime) ? c.bestTime : "any",
    hours: c.hours && typeof c.hours === "object" ? c.hours : null,

    "\nReply with ONLY one JSON object, no prose:\n" +

// Lay out unplaced wish-list items: hardest-to-fit first, each to the day whose picks are closest, capped by pace.
function findSlot(c, di) {
  const w = dayWindow(di, draftDays().length);
  const pref = { morning: 600, afternoon: 840, evening: 1140, any: 630 }[c.bestTime];
  const starts = [];
  for (let s = Math.ceil(w.s / 30) * 30; s + c.minutes <= w.e; s += 30) starts.push(s);
  starts.sort((a, b) => Math.abs(a - pref) - Math.abs(b - pref));
  const s = starts.find(x => !issuesAt(c, di, x, 30).length);
  return s == null ? null : s;
}
function suggestPlan(all) {
  const d = DRAFT, days = draftDays();
  if (all) d.place = {};
  const cap = ANCHORS_PER_DAY[d.prefs.pace] || 3;
  const items = d.wish.map(candById).filter(c => c && !d.place[c.id]);
  const options = new Map(items.map(c => [c.id, days.filter((_, di) => findSlot(c, di) != null).length]));
  items.sort((a, b) => options.get(a.id) - options.get(b.id));
  let placed = 0;
  items.forEach(c => {
    let best = null;
    days.forEach((_, di) => {
      const mine = Object.keys(d.place).filter(id => d.place[id].day === di).map(candById).filter(Boolean);
      if (mine.length >= cap) return;
      const slot = findSlot(c, di); if (slot == null) return;
      const near = mine.filter(hasLL);
      const score = mine.length * 5 + (near.length && hasLL(c) ? Math.min(...near.map(o => km(o, c))) : mine.length ? 2 : 0);
      if (!best || score < best.score) best = { di, slot, score };
    });
    if (best) { d.place[c.id] = { day: best.di, start: toHM(best.slot) }; placed++; }
  });
  saveDraft();
  return { placed, left: items.length - placed };
}

function fillTrip() {
  const d = DRAFT, days = draftDays();
  const anchors = Object.keys(d.place).map(id => ({ c: candById(id), pl: d.place[id] })).filter(x => x.c && x.pl.day < days.length)
    .sort((a, b) => a.pl.day - b.pl.day || toMin(a.pl.start) - toMin(b.pl.start))
    .map(({ c, pl }) => ({ date: days[pl.day], start: pl.start, end: toHM(toMin(pl.start) + c.minutes), name: c.name, neighborhood: c.neighborhood, address: c.address, fill: !!c.fill, fixed: !!c.fixed }));
  if (!anchors.length) { toast("Place at least one pick on a day first."); return; }
  if (!sampleFn) { toast(noClaudeCopy("Filling in your days")); return; }
  const spare = d.wish.map(candById).filter(c => c && !(d.place[c.id] && d.place[c.id].day < days.length)).map(c => c.name + (c.neighborhood ? " (" + c.neighborhood + ")" : ""));
  if (!d.learned) { learnFrom(Object.keys(d.place).map(candById).filter(c => c && !c.placeholder)); d.learned = true; saveDraft(); }
  generate(Object.assign({}, d.prefs, { anchors, spare, extra: d.extra || null, tripId: d.tripId || null }));
}

function lanes(ids) {
  const items = ids.map(id => ({ id, s: toMin(DRAFT.place[id].start), e: toMin(DRAFT.place[id].start) + candById(id).minutes })).sort((a, b) => a.s - b.s);
  const out = {}; let group = [], ends = [], groupEnd = -1;
  const close = () => group.forEach(g => { out[g.id].of = ends.length; });
  items.forEach(it => {
    if (it.s >= groupEnd) { close(); group = []; ends = []; }
    let lane = ends.findIndex(e => e <= it.s); if (lane < 0) { lane = ends.length; ends.push(0); }
    ends[lane] = it.e; groupEnd = Math.max(groupEnd, it.e);
    out[it.id] = { lane, of: 1 }; group.push(it);
  });
  close();
  return out;
}

function spreadText(di) {

function showBands(c) {
  const { gs, ge } = gridRange(), days = draftDays();

    const iv = hoursOn(c, days[+col.dataset.day]);

    iv.forEach(([a, b]) => { const t = Math.max(a, gs), u = Math.min(b, ge); if (u > t) col.insertAdjacentHTML("beforeend", '<div class="band" style="top:' + px(t - gs) + "px;height:" + px(u - t) + 'px"></div>'); });

function dragMove(e) {
  const c = candById(drag.id); if (!c) return;
  const h = Math.max(c.minutes / 60 * PXH, 34);
  if (!drag.active) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 5) return;
    drag.active = true;
    drag.el.classList.add("lifted");
    const f = document.createElement("div");
    f.className = "drag-float"; f.style.setProperty("--c", "var(" + CATS[c.category] + ")"); f.style.height = h + "px"; f.textContent = c.name;
    document.body.appendChild(f); drag.float = f;
    showBands(c);
  }
  drag.float.style.left = (e.clientX - 24) + "px"; drag.float.style.top = (e.clientY - drag.offY) + "px";
  if (e.clientY < 70) window.scrollBy(0, -12); else if (e.clientY > innerHeight - 70) window.scrollBy(0, 12);

  $("#tray").classList.toggle("over", !!tray && !!DRAFT.place[drag.id]);
  drag.target = tray ? { tray: true } : null;
  if (!col) return;
  const { gs, ge } = gridRange(), di = +col.dataset.day;
  let s = gs + Math.round((e.clientY - drag.offY - col.getBoundingClientRect().top) / PXH * 60 / SNAP) * SNAP;

  drag.target = { day: di, start: s, iss };
}
function dragEnd(cancel) {

/* ---------- Travel profile (a chat that learns how someone likes to travel; prefills every new trip) ---------- */
const DIETS = ["Vegetarian", "Vegan", "Gluten-free", "Pescatarian", "Kosher", "Halal", "No shellfish"];
const INTERESTS = [["food", "Food"], ["culture", "Culture & history"], ["outdoors", "Outdoors & adventure"], ["nightlife", "Drinks & nightlife"], ["shopping", "Shopping"]];
const PROF_ENUM = { pace: ["Relaxed", "Moderate", "Jam-packed"], budget: ["Budget", "Mid-range", "Splurge"], lodging: ["Hotel", "Boutique hotel", "Vacation rental", "No preference"] };
const PROF_LISTS = ["loves", "avoids", "diet", "beenTo", "dreamTrips"];

function emptyProfile() {
  return { homeCity: "", travelsWith: "", pace: "", budget: "", lodging: "", dayStart: "", dayEnd: "", interests: {}, loves: [], avoids: [], diet: [], needs: "", beenTo: [], dreamTrips: [], notes: "", persona: { title: "", tagline: "" }, routines: [], dietLevel: {}, learned: {} };
}
function normProfile(raw) {
  const p = Object.assign(emptyProfile(), raw || {});
  ["homeCity", "travelsWith", "needs", "notes"].forEach(k => { p[k] = String(p[k] || "").trim(); });
  const pe = p.persona && typeof p.persona === "object" ? p.persona : {};
  p.persona = { title: String(pe.title || "").trim().slice(0, 60), tagline: String(pe.tagline || "").trim().slice(0, 160) };
  p.routines = (Array.isArray(p.routines) ? p.routines : []).filter(x => x && x.what).slice(0, 8).map(x => ({ what: String(x.what).slice(0, 40), when: String(x.when || "").slice(0, 20), who: String(x.who || "").slice(0, 40) }));
  p.dietLevel = p.dietLevel && typeof p.dietLevel === "object" ? p.dietLevel : {};
  p.learned = p.learned && typeof p.learned === "object" ? p.learned : {};
  Object.keys(PROF_ENUM).forEach(k => { if (!PROF_ENUM[k].includes(p[k])) p[k] = ""; });
  ["dayStart", "dayEnd"].forEach(k => { p[k] = /^\d{2}:\d{2}$/.test(p[k]) ? p[k] : ""; });
  const ints = {};
  INTERESTS.forEach(([k]) => { const n = Math.round(Number((p.interests || {})[k])); if (n >= 1 && n <= 5) ints[k] = n; });
  p.interests = ints;
  PROF_LISTS.forEach(k => {
    const seen = new Set();
    p[k] = (Array.isArray(p[k]) ? p[k] : []).map(v => String(v || "").trim()).filter(v => v && !seen.has(v.toLowerCase()) && seen.add(v.toLowerCase())).slice(0, 20);
  });
  p.diet = p.diet.filter(d => DIETS.includes(d));
  return p;
}
let PROFILE = normProfile(store("mytin.profile"));
let CHAT = store("mytin.profileChat") || { messages: [], done: false };
let profBusy = false, profErr = "";

function hasProfile() { return JSON.stringify(PROFILE) !== JSON.stringify(emptyProfile()); }
function saveChat() { store("mytin.profileChat", CHAT); }
function saveProfile(p) { PROFILE = normProfile(p); store("mytin.profile", PROFILE); applyProfileToForm(); }
// The profile is the default for every new trip; the plan form can still be changed per trip.
function applyProfileToForm() {
  const p = PROFILE;
  if (p.homeCity) FORM.from = p.homeCity;
  ["pace", "budget", "lodging", "dayStart", "dayEnd"].forEach(k => { if (p[k]) FORM[k] = p[k]; });
  INTERESTS.forEach(([k]) => { if (p.interests[k]) FORM[k] = p.interests[k]; });
  if (p.diet.length) { FORM.diet = p.diet.slice(); FORM.dietLevel = Object.assign({}, p.dietLevel); }
  store("mytin.form", FORM);
}
// The parts of the profile the plan form doesn't already carry.
function profileText(p) {
  const L = [];
  if (p.travelsWith) L.push("Usually travels with: " + p.travelsWith);
  if (p.loves.length) L.push("Seeks out: " + p.loves.join("; "));
  if (p.avoids.length) L.push("Avoid: " + p.avoids.join("; "));
  if (p.needs) L.push("Planning needs: " + p.needs);
  if (p.routines.length) L.push("Daily routines (home time): " + p.routines.map(x => x.what + (x.when ? " " + x.when : "") + (x.who ? " (" + x.who + ")" : "")).join("; "));
  if (p.beenTo.length) L.push("Has already been to: " + p.beenTo.join(", "));
  if (p.notes) L.push("Other: " + p.notes);
  return L.length ? "TRAVELER PROFILE (long-standing tastes; the trip details above win if they conflict):\n" + L.map(x => "- " + x).join("\n") : "";
}
function profileBanner() {
  return hasProfile()
    ? '<div class="banner prof-banner"><span><strong>Pre-filled from your travel profile.</strong> Changes here only apply to this trip.</span><a class="btn small" href="#profile">Edit profile</a></div>'
    : '<div class="banner prof-banner"><span><strong>New here?</strong> Tell us how you like to travel once, and every trip starts from your answers.</span><a class="btn small primary" href="#profile">Set up your travel profile</a></div>';

function profileOpener() {

    ? "Welcome back. Everything I know about how you travel is on the right. What would you like to add or change?"
    : "Hi! I'm going to learn how you like to travel, so every trip starts from you instead of a blank form. It's about seven quick questions. Skip any you like, and if you change your mind later, just say so.\n\nTo start: where do you usually travel from, and who usually comes with you?";
}
function profilePrompt() {

  return "You are the travel-profile interviewer for Mytinerary, an app that builds day-by-day trip itineraries. Through a short, friendly chat you learn how this person likes to travel, so every future trip starts from their tastes.\n\n" +

    "PROFILE RULES\n" +

    "- interests: 1-5 for food, culture, outdoors, nightlife, shopping (5 = a reason to take the trip, 1 = skip it).\n" +
    "- loves and avoids: short, specific phrases (\"natural wine bars\", \"long lines\"). diet: only from " + DIETS.join(", ") + ". beenTo and dreamTrips: place names.\n" +
    "- routines: daily fixed times the plan must respect, on home time, e.g. {\"what\":\"Nap\",\"when\":\"12:30-14:30\",\"who\":\"daughter\"} or {\"what\":\"Bedtime\",\"when\":\"19:00\",\"who\":\"daughter\"}.\n" +
    "- dietLevel: for each diet entry, how strict it is: preference | restriction | allergy. Ask if it isn't clear.\n" +
    "- persona: once you know three or more things, give them a travel persona for a shareable card. title: 2-5 words, warm, specific and a little playful (\"The Slow-Morning Food Hunter\", not \"Foodie Traveler\"). tagline: one sentence in second person that captures how they travel. Refine both as you learn more.\n\n" +
    "THE PROFILE SO FAR\n" + JSON.stringify(PROFILE) + "\n\n" +
    "THE CONVERSATION\n" + transcript + "\n\n" +
    'Reply with ONLY one JSON object, no prose: {"reply":"your next message","done":false,"profile":{"homeCity":"","travelsWith":"","pace":"","budget":"","lodging":"","dayStart":"","dayEnd":"","interests":{"food":0,"culture":0,"outdoors":0,"nightlife":0,"shopping":0},"loves":[],"avoids":[],"diet":[],"needs":"","beenTo":[],"dreamTrips":[],"notes":"","persona":{"title":"","tagline":""},"routines":[],"dietLevel":{}}}';
}
function profErrorCopy(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled") return "Claude access isn't allowed for this page, so the profile chat can't run.";
  if (c === "rate_limited") return "You've hit a usage limit. Try again in a few minutes.";
  if (c === "invalid_json") return "Claude's answer didn't come back in a usable shape. Send it again.";
  return "Something went wrong. Send it again.";
}
async function sendProfile(text) {
  text = String(text || "").trim();
  if (!text || profBusy) return;
  if (!sampleFn) {
    profErr = sampleBlocked ? "Claude access was declined for this page. Reload to be asked again." : "The profile chat needs Claude, which is available when this page is open on claude.ai.";
    updateProfileUI(); return;
  }
  CHAT.messages.push({ role: "user", text });
  profBusy = true; profErr = ""; saveChat(); updateProfileUI();
  try {
    const r = await sampleFn.json(profilePrompt(), { modelTier: "default", cache: false });
    if (!r || typeof r.reply !== "string" || !r.reply.trim()) throw { code: "invalid_json" };
    if (r.profile) saveProfile(r.profile);
    CHAT.messages.push({ role: "assistant", text: r.reply.trim() });
    CHAT.messages = CHAT.messages.slice(-60);
    CHAT.done = CHAT.done || r.done === true;
  } catch (e) {
    CHAT.messages.pop(); // put their words back so nothing is lost
    if (e && e.code === "not_granted") sampleBlocked = true;
    profErr = profErrorCopy(e);
    const ta = $("#profInput"); if (ta && !ta.value) ta.value = text;
  }
  profBusy = false; saveChat(); updateProfileUI();
  const ta = $("#profInput"); if (ta) ta.focus();
}

function renderProfile() {
  return '<div class="wrap prof"><span class="eyebrow">' + (onboarding() ? "Step 1 of 2 · Your travel style" : "Travel profile") + '</span><h1>How do you like to travel?</h1>' +
    '<p class="lede">A short chat, about three minutes. What you tell me is saved' + (HOSTED && ME ? " to your account" : " in this browser") + ' and becomes the starting point for every trip you plan.</p>' +
    '<div class="prof-grid"><section class="chat" aria-label="Profile chat">' +
      '<div class="chat-log" id="profLog" aria-live="polite"></div>' +
      '<form class="chat-input" id="profForm"><textarea id="profInput" rows="1" placeholder="Type your answer" aria-label="Your answer"></textarea><button class="btn primary" type="submit" id="profSend">Send</button></form>' +
      '<div class="chat-foot"><button class="lnk" type="button" id="profSkip">Skip this question</button><span class="err" id="profErr" role="alert"></span>' +
        (onboarding() ? '<button class="lnk" type="button" id="profLater">Finish later</button>' : "") + "</div>" +
    '</section><aside class="prof-side"><section class="panel card-panel" id="cardPanel"></section><section class="panel prof-panel" id="profPanel" aria-label="What I know about you"></section></aside></div></div>';
}
function profLogHTML() {
  return CHAT.messages.map(m => '<div class="msg ' + (m.role === "user" ? "user" : "assistant") + '">' + esc(m.text) + "</div>").join("") +
    (profBusy ? '<div class="msg assistant typing" aria-label="Claude is typing"><i></i><i></i><i></i></div>' : "") +
    (CHAT.done && !profBusy ? '<div class="prof-done"><span>Your profile is saved. Your travel card is ready to share.</span><a class="btn small primary" href="' + (HOSTED && !savedTrips().length ? "#start" : "#plan") + '">' + (HOSTED && !savedTrips().length ? "Next: pick a starting point →" : "Plan a trip with it") + "</a></div>" : "");
}
function profPanelHTML() {
  const p = PROFILE;
  const row = (k, v) => v ? '<div class="pf-row"><span class="pf-k">' + k + "</span><span>" + esc(v) + "</span></div>" : "";
  const chips = (key, label) => p[key].length ? '<div class="pf-sec"><span class="pf-k">' + label + '</span><div class="pf-chips">' +
    p[key].map((v, i) => '<span class="pf-chip">' + esc(v) + '<button type="button" data-rm="' + key + '" data-i="' + i + '" aria-label="Remove ' + esc(v) + '">×</button></span>').join("") + "</div></div>" : "";
  const hours = p.dayStart || p.dayEnd ? (fmtTime(p.dayStart) || "?") + " to " + (fmtTime(p.dayEnd) || "?") : "";
  const basics = row("Home", p.homeCity) + row("Travels with", p.travelsWith) + row("Pace", p.pace) + row("Budget", p.budget) + row("Stays", p.lodging) + row("Day", hours) +
    row("Routines", p.routines.map(x => x.what + (x.when ? " " + x.when : "") + (x.who ? " (" + x.who + ")" : "")).join(" · ")) + row("Needs", p.needs) + row("Also", p.notes);
  const ints = INTERESTS.filter(([k]) => p.interests[k]).map(([k, l]) => '<div class="pf-int"><span>' + esc(l) + '</span><span class="dots" role="img" aria-label="' + p.interests[k] + ' out of 5">' +
    [1, 2, 3, 4, 5].map(n => "<i" + (n <= p.interests[k] ? ' class="on"' : "") + "></i>").join("") + "</span></div>").join("");
  const body = hasProfile()
    ? (basics ? '<div class="pf-sec">' + basics + "</div>" : "") + (ints ? '<div class="pf-sec"><span class="pf-k">Interests</span>' + ints + "</div>" : "") +
      chips("loves", "Seeks out") + chips("avoids", "Avoids") + chips("diet", "Diet") + chips("beenTo", "Been to") + chips("dreamTrips", "On the list") +
      '<div class="pf-actions"><a class="btn small primary" href="' + (HOSTED ? "#start" : "#plan") + '">Plan a trip with this</a><button class="btn small ghost" type="button" id="profReset">Start over</button></div>'
    : '<p class="pf-empty">Nothing yet. What I learn shows up here as we talk, and it\'s saved right away.</p>';
  return "<h3>What I know about you <small>" + (HOSTED && ME ? "saved to your account" : "saved in this browser") + "</small></h3>" + body;
}
function updateProfileUI() {
  const log = $("#profLog"); if (!log) return; // they navigated away mid-reply
  log.innerHTML = profLogHTML(); log.scrollTop = log.scrollHeight;
  $("#profPanel").innerHTML = profPanelHTML();
  const card = $("#cardPanel"), cardHTML = cardPanelHTML();
  card.classList.toggle("hidden", !cardHTML);
  if (card.dataset.html !== cardHTML || !cardHTML) { card.innerHTML = cardHTML; card.dataset.html = cardHTML; bindCard(); }
  else drawProfileCard($("#profCard"));
  $("#profErr").textContent = profErr;
  $("#profSend").disabled = profBusy; $("#profSkip").disabled = profBusy;
  $("#profPanel").querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => {
    const p = JSON.parse(JSON.stringify(PROFILE)); p[b.dataset.rm].splice(+b.dataset.i, 1);
    saveProfile(p); updateProfileUI();
  }));
  const reset = $("#profReset");
  if (reset) reset.addEventListener("click", () => {
    if (!confirm("Clear your travel profile and start the chat over?")) return;
    PROFILE = emptyProfile(); store("mytin.profile", PROFILE);
    CHAT = { messages: [{ role: "assistant", text: profileOpener() }], done: false }; saveChat();
    profErr = ""; updateProfileUI();
  });
}
function bindProfile() {
  if (!CHAT.messages.length) { CHAT.messages.push({ role: "assistant", text: profileOpener() }); saveChat(); }
  updateProfileUI();
  const ta = $("#profInput");
  const fit = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight + 2, 140) + "px"; };
  ta.addEventListener("input", fit);
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#profForm").requestSubmit(); } });
  $("#profForm").addEventListener("submit", e => { e.preventDefault(); const v = ta.value; if (!v.trim() || profBusy) return; ta.value = ""; fit(); sendProfile(v); });
  $("#profSkip").addEventListener("click", () => sendProfile("I'd rather skip this one."));
  const later = $("#profLater");
  if (later) later.addEventListener("click", () => { CHAT.skipped = true; saveChat(); location.hash = "start"; });
  if (window.matchMedia("(pointer: fine)").matches) ta.focus();
}

/* ---------- My trips menu ---------- */
function renderTripsMenu() {
  const list = savedTrips();
  const pop = $("#tripsMenu");
  pop.innerHTML = (HOSTED ? "" : '<button data-load="example"><strong>San Francisco weekend</strong><small>Example from the 2020 template</small></button>') +
    (list.length ? list.map(t => '<button data-load="' + esc(t.id) + '"><strong>' + esc(t.destination) + "</strong><small>" + esc(fmtRange(t.startDate, t.endDate)) + "</small></button>").join("") : '<div class="empty">Trips you build are saved here, ' + (HOSTED ? "in your account" : "in this browser") + '.</div>');
  pop.querySelectorAll("[data-load]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.load;
    S.trip = id === "example" ? normalize(JSON.parse(JSON.stringify(EXAMPLE))) : normalize(savedTrips().find(x => x.id === id));
    S.day = 0; closeMenu(); store("mytin.lastOpened", id);
    if (location.hash === "#trip") { S.view = "trip"; render(); } else location.hash = "trip";
  }));
}
function closeMenu() { $("#tripsMenu").classList.remove("open"); $("#tripsBtn").setAttribute("aria-expanded", "false"); }
$("#tripsBtn").addEventListener("click", e => {
  e.stopPropagation();
  const open = $("#tripsMenu").classList.toggle("open");
  $("#tripsBtn").setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", e => { if (!e.target.closest(".menu")) closeMenu(); });

/* ---------- Boot ---------- */
S.scan.trips = loadFound();
if (DEMO) $("#demoBar").classList.remove("hidden");
const last = savedTrips()[0];
S.trip = normalize(JSON.parse(JSON.stringify(EXAMPLE)));
if (last && store("mytin.lastOpened") === last.id) S.trip = normalize(last);
route();
})();
</script>
