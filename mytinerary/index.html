<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mytinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a trip drawn as a transit map. Each day is a colored line; stops sit on it in order,
   with travel legs between them. Main column = the day's line; side rail = map, home base, bookings, budget. */
:root {
  --paper: #F2F3EE;
  --card: #FFFFFF;
  --ink: #111722;
  --muted: #586170;
  --rule: #D8DBD2;
  --accent: #E0442B;
  --tint: #FBEDE9;
  --good: #2F8F4E;
  --warn: #B7791F;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --on-c: #FFFFFF;
  --l1: #E0442B; --l2: #0E8C8C; --l3: #C98A12; --l4: #5B4BC4; --l5: #2F8F4E; --l6: #C2417E; --l7: #2C6DB5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141B; --card: #161D27; --ink: #ECEEE8; --muted: #9AA3AF; --rule: #273141;
    --accent: #FF6A4D; --tint: #2A1C1A; --good: #5CC283; --warn: #E3A843;
    --l1: #FF6A4D; --l2: #2FB5B5; --l3: #E3A843; --l4: #8C7FF0; --l5: #5CC283; --l6: #E874A8; --l7: #5C9BE6;
    --on-c: #0F141B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141B; --card: #161D27; --ink: #ECEEE8; --muted: #9AA3AF; --rule: #273141;
  --accent: #FF6A4D; --tint: #2A1C1A; --good: #5CC283; --warn: #E3A843;
  --l1: #FF6A4D; --l2: #2FB5B5; --l3: #E3A843; --l4: #8C7FF0; --l5: #5CC283; --l6: #E874A8; --l7: #5C9BE6;
  --on-c: #0F141B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
@media (max-width: 480px) { .wrap { padding: 0 16px; } }

/* Top bar */
.top { border-bottom: 1px solid var(--rule); background: var(--paper); position: sticky; top: 0; z-index: 20; }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.mark { font-family: var(--display); font-weight: 700; font-size: 23px; letter-spacing: -0.01em; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.mark .dot { width: 14px; height: 14px; border-radius: 50%; border: 4px solid var(--accent); background: var(--card); }
.tagline { color: var(--muted); font-size: 14px; }
.top .spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--card); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; line-height: 1.2; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.menu { position: relative; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--rule); border-radius: 12px; min-width: 260px; padding: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.12); display: none; z-index: 30; }
.menu-pop.open { display: block; }
.menu-pop button { display: flex; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; flex-direction: column; }
.menu-pop button:hover { background: var(--paper); }
.menu-pop small { color: var(--muted); }
.menu-pop .empty { padding: 10px; color: var(--muted); font-size: 14px; }

/* Banner */
.banner { margin: 18px 0 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border: 1px dashed var(--rule); border-radius: 12px; font-size: 14px; color: var(--muted); }
.banner strong { color: var(--ink); }

/* Trip header */
.trip-head { padding: 28px 0 22px; border-bottom: 2px solid var(--ink); display: grid; gap: 14px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dest { font-family: var(--display); font-weight: 700; font-size: clamp(40px, 8vw, 104px); line-height: 1; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.thesis { font-size: 19px; max-width: 62ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--mono); font-size: 12px; padding: 4px 9px; border: 1px solid var(--rule); border-radius: 999px; background: var(--card); white-space: nowrap; }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Day line legend */
.lines { display: flex; gap: 10px; overflow-x: auto; padding: 18px 0 6px; scrollbar-width: thin; }
.line-tab { flex: 0 0 auto; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 14px 10px 10px; cursor: pointer; min-width: 190px; max-width: 260px; }
.line-tab .bullet { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: var(--on-c); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 16px; }
.line-tab .d { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.line-tab .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.line-tab[aria-selected="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }

/* Main grid */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; padding: 18px 0 60px; align-items: start; }
@media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
.rail { display: grid; gap: 18px; position: sticky; top: 76px; }
@media (max-width: 980px) { .rail { position: static; } }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 16px; }
.panel h3 { font-family: var(--body); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h3 small { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--muted); text-transform: none; letter-spacing: 0; }

/* Day header */
.day-head { display: grid; gap: 8px; margin-bottom: 18px; }
.day-head h2 { font-family: var(--display); font-weight: 600; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.15; letter-spacing: -0.01em; }
.day-head .pitch { font-size: 17px; color: var(--muted); max-width: 64ch; }
.day-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rework { display: flex; gap: 8px; flex: 1 1 320px; }
.rework input { flex: 1; min-width: 0; border: 1px solid var(--rule); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 14px; }

/* Timeline */
.timeline { position: relative; display: grid; gap: 0; }
.stop { display: grid; grid-template-columns: 88px 40px minmax(0, 1fr); align-items: start; }
.stop .time { font-family: var(--mono); font-size: 13px; padding-top: 18px; text-align: right; padding-right: 8px; font-variant-numeric: tabular-nums; }
.stop .time small { display: block; white-space: nowrap; color: var(--muted); font-size: 11px; }
.rail-col { position: relative; align-self: stretch; display: flex; justify-content: center; }
.rail-col::before { content: ""; position: absolute; top: 0; bottom: 0; width: 6px; background: var(--c); left: 50%; transform: translateX(-50%); }
.stop:first-child .rail-col::before { top: 22px; }
.stop:last-child .rail-col::before { bottom: calc(100% - 22px); }
.node { position: relative; z-index: 1; margin-top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--card); border: 4px solid var(--c); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 600; }
.node.minor { width: 16px; height: 16px; margin-top: 17px; border-width: 3px; }
.node.home { border-radius: 4px; }
.card { margin: 6px 0; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; transition: border-color .15s, box-shadow .15s; }
.card.hl { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.card.free { background: transparent; border-style: dashed; }
.card.transitk { background: transparent; border: 0; padding: 10px 2px; }
.card .cat { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.card .name { font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1.2; }
.card .why { font-size: 15px; }
.tip { font-size: 14px; background: var(--tint); border-left: 3px solid var(--accent); padding: 7px 10px; border-radius: 0 8px 8px 0; }
.tip b { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; }
.card .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
.pill { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--rule); white-space: nowrap; }
.pill.now { background: var(--accent); color: #fff; border-color: var(--accent); }
.pill.daybefore { border-color: var(--warn); color: var(--warn); }
.pill.walkin { color: var(--muted); }
.lnk { font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; padding: 2px 4px; cursor: pointer; }
.lnk:hover { color: var(--ink); }
.leg { display: grid; grid-template-columns: 88px 40px minmax(0,1fr); }
.leg .rail-col::before { background: repeating-linear-gradient(var(--c) 0 6px, transparent 6px 11px); width: 4px; }
.leg .txt { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 6px 0; }

/* Map */
.map svg { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--paper); }
.map .gridl { stroke: var(--rule); stroke-width: 1; }
.map text { font-family: var(--mono); fill: var(--muted); font-size: 11px; }
.map .stop-c { cursor: pointer; }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.map-legend i { width: 14px; height: 4px; border-radius: 2px; background: var(--c); display: inline-block; }

/* Home base */
.home-name { font-family: var(--display); font-weight: 600; font-size: 18px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.routine { display: grid; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rule); }
.routine div { display: grid; grid-template-columns: 92px 1fr; gap: 8px; font-size: 14px; }
.routine b { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 400; padding-top: 2px; }
.alts { margin-top: 10px; font-size: 14px; }
.alts summary { cursor: pointer; color: var(--muted); }
.alts ul { margin: 8px 0 0; padding-left: 18px; }

/* Bookings */
.bk-group { display: grid; gap: 4px; margin-bottom: 12px; }
.bk-group:last-child { margin-bottom: 0; }
.bk-label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.bk-label .sw { width: 8px; height: 8px; border-radius: 50%; }
.bk { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: start; font-size: 14px; padding: 4px 0; }
.bk input { margin-top: 3px; accent-color: var(--accent); }
.bk.done span { text-decoration: line-through; color: var(--muted); }
.bk em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; padding-top: 2px; }

/* Budget */
.bud-row { display: grid; grid-template-columns: 44px 1fr 64px; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 8px; }
.bud-row .lab { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.bud-row .amt { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 14px; background: var(--paper); border-radius: 4px; display: flex; overflow: visible; }
.bar span { height: 100%; }
.bar span:first-child { border-radius: 4px 0 0 4px; }
.bar .target { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.bud-key { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.bud-key span { display: inline-flex; align-items: center; gap: 5px; }
.bud-key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.bud-sum { font-size: 14px; margin-bottom: 12px; }
.bud-sum strong { font-family: var(--display); font-size: 26px; font-weight: 700; display: block; line-height: 1.1; }

.watch { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 6px; }

/* Plan form */
.plan { max-width: 860px; padding: 32px 0 80px; }
.plan h1 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 6vw, 72px); line-height: 1; letter-spacing: -0.02em; }
.plan .lede, .prof .lede { font-size: 18px; color: var(--muted); max-width: 58ch; margin: 14px 0 26px; }
fieldset { border: 0; border-top: 2px solid var(--ink); margin: 0 0 26px; padding: 16px 0 0; display: grid; gap: 16px; }
legend { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; padding: 0 10px 0 0; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
label.f { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
label.f span.h { font-weight: 400; color: var(--muted); font-size: 13px; }
.inp { border: 1px solid var(--rule); background: var(--card); border-radius: 10px; padding: 10px 12px; width: 100%; font-weight: 400; font-size: 16px; }
textarea.inp { min-height: 88px; resize: vertical; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-block; padding: 8px 14px; border: 1px solid var(--rule); border-radius: 999px; background: var(--card); font-size: 14px; font-weight: 500; }
.seg input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.sliders { display: grid; gap: 12px; }
.sl { display: grid; grid-template-columns: 170px 1fr 28px; gap: 12px; align-items: center; font-size: 15px; }
.sl input { accent-color: var(--accent); width: 100%; }
.sl output { font-family: var(--mono); text-align: right; }
@media (max-width: 480px) { .sl { grid-template-columns: 1fr 28px; } .sl input { grid-column: 1 / -1; grid-row: 2; } }
.qlabel { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.form-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.form-actions .btn.primary { padding: 12px 22px; font-size: 16px; }
.note { font-size: 13px; color: var(--muted); }
.err { color: var(--accent); font-size: 14px; font-weight: 600; }

/* Generating */
.gen { padding: 60px 0 100px; max-width: 760px; }
.gen .dest { font-size: clamp(40px, 7vw, 88px); }
.gen-line { margin: 34px 0 18px; height: 8px; border-radius: 4px; background: var(--rule); position: relative; overflow: hidden; }
.gen-line i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; transition: width .6s ease; }
.gen-stops { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
.gen-stops .chip { animation: pop .3s ease both; }
@keyframes pop { from { transform: scale(.8); opacity: .2; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .gen-stops .chip { animation: none; } .gen-line i { transition: none; } }
.gen-status { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 14px; }

/* Drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(10,14,20,.35); z-index: 40; display: none; }
.drawer-bg.open { display: block; }
.drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(460px, 100%); background: var(--paper); border-left: 1px solid var(--rule); z-index: 41; transform: translateX(105%); transition: transform .2s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer header { padding: 18px 18px 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 4px; }
.drawer header h3 { font-family: var(--display); font-weight: 600; font-size: 22px; }
.drawer .body { padding: 16px 18px; overflow-y: auto; display: grid; gap: 10px; align-content: start; flex: 1; }
.drawer .x { position: absolute; right: 14px; top: 14px; }
.alt { text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px; cursor: pointer; display: grid; gap: 4px; }
.alt:hover { border-color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 60; display: none; max-width: calc(100% - 32px); }
.toast.show { display: block; }
/* Import from Gmail / Calendar */
.import { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 18px; display: grid; gap: 12px; margin: 0 0 28px; }
.import h2 { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.15; }
.import .row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.found-strip { margin: 18px 0 0; }
.found-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.found { border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; background: var(--paper); align-content: start; }
.found .fd { font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1.1; }
.found ul { margin: 0; padding-left: 16px; font-size: 13px; color: var(--muted); }
.found .btn { justify-self: start; margin-top: 4px; }
.scan-notes { font-size: 13px; color: var(--warn); margin: 0; padding-left: 18px; }
.pill.booked { background: var(--good); border-color: var(--good); color: #fff; }
.booked-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.booked-list li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.hidden { display: none !important; }
.who { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
@media (max-width: 760px) { .who .em { display: none; } }
.login { padding: 64px 0 100px; max-width: 680px; }
.login .look { margin-top: 24px; max-width: 520px; }
.login .lede { font-size: 18px; color: var(--muted); margin: 12px 0 0; }
.tile.photo { color: #fff; background-size: cover; background-position: center; background-color: var(--c); }
.tile.photo::after { display: none; }
.tile.photo .tile-line i { background: rgba(0,0,0,.35); }
.unverified { font-size: 12px; font-weight: 600; color: var(--warn); }
.wbody .foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.demo-bar { background: var(--ink); color: var(--paper); font-size: 13px; }
.demo-bar .wrap { padding-top: 7px; padding-bottom: 7px; }
.demo-bar strong { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; background: var(--accent); color: #fff; padding: 2px 7px; border-radius: 999px; margin-right: 8px; }

/* Planning flow: steps, wish list, anchor board */
.planflow { padding: 28px 0 120px; }
.pf-title { font-family: var(--display); font-weight: 700; font-size: clamp(32px, 5vw, 56px); line-height: 1.05; letter-spacing: -0.02em; }
.planflow .lede { font-size: 17px; color: var(--muted); max-width: 64ch; margin: 10px 0 0; }
.planflow .grid.wide { grid-template-columns: minmax(0, 1fr) 360px; }
@media (max-width: 980px) { .planflow .grid.wide { grid-template-columns: 1fr; } }
.steps { display: flex; flex-wrap: wrap; gap: 6px 22px; list-style: none; padding: 0; margin: 0 0 18px; font-size: 14px; color: var(--muted); }
.steps li, .steps a { display: flex; align-items: center; gap: 8px; text-decoration: none; }

<script>
(function () {
"use strict";

/* ---------- Claude runtime ---------- */
// ?mock on localhost or the home network swaps in fake Claude + connectors so the UI can be tested outside claude.ai.
// The public GitHub Pages demo always runs on sample data, since Claude is only available on claude.ai.
const DEMO = /\.github\.io$/.test(location.hostname);
const MOCK = DEMO || /[?&]mock\b/.test(location.search) && /^(localhost|127\.0\.0\.1|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|[\w-]+\.local)$/.test(location.hostname);
const hasRuntime = window.claude && typeof window.claude.use === "function";
const sampleP = MOCK ? Promise.resolve(mockSample()) : hasRuntime ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
const mcpP = MOCK ? Promise.resolve(mockMcp()) : hasRuntime ? window.claude.use("mcp").catch(() => null) : Promise.resolve(null);
let sampleFn = null, mcpApi = null;
let sampleBlocked = false;
let runtimeSettled = false;
// Hosted on our own server (Railway): Claude and Google Places go through /api, behind an emailed sign-in link.
let HOSTED = false, ME = null, PLACES = false;
const hostedP = !MOCK && !hasRuntime && /^https?:$/.test(location.protocol)
  ? fetch("/api/me").then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null);
Promise.all([sampleP, mcpP, hostedP]).then(([s, m, h]) => {
  if (h && h.hosted) { HOSTED = true; ME = h.user; PLACES = !!(h.places && ME); if (ME && h.claude) s = hostedSample(); }
  sampleFn = s; mcpApi = m; runtimeSettled = true; render(); maybeAutoScan();
});
// Same shape as the claude.ai sampling function: fn(prompt) -> {text}, fn.json(prompt, {onText, signal, modelTier}) -> parsed JSON.
function hostedSample() {
  async function text(prompt, opts) {
    opts = opts || {};
    let r;
    try {
      r = await fetch("/api/claude", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ prompt, tier: opts.modelTier === "quick" ? "quick" : "default" }), signal: opts.signal });
    } catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network" }; }
    if (r.status === 401) { ME = null; render(); throw { code: "signed_out" }; }
    if (r.status === 429) throw { code: "rate_limited" };
    if (!r.ok || !r.body) throw { code: "api_error" };
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "", out = "", stop = "";
    for (;;) {
      let chunk;
      try { chunk = await reader.read(); } catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network" }; }
      if (chunk.done) break;
      buf += dec.decode(chunk.value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const ln = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!ln.trim()) continue;
        const o = JSON.parse(ln);
        if (o.t) { out += o.t; if (opts.onText) opts.onText({ text: out, delta: o.t }); }
        else if (o.error) throw o.error;
        else if (o.done) stop = o.stop;
      }
    }
    if (stop === "refusal") throw { code: "refused" };
    return { text: out, truncated: stop === "max_tokens" };
  }
  function parseJSON(s) {
    try { return JSON.parse(s); } catch (e) { /* try the tolerant forms below */ }
    const a = Math.min(...["{", "["].map(ch => { const k = s.indexOf(ch); return k < 0 ? Infinity : k; }));
    const z = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]"));
    if (a < z) { try { return JSON.parse(s.slice(a, z + 1)); } catch (e) { /* fall through */ } }
    throw { code: "invalid_json" };
  }
  const fn = (prompt, opts) => text(prompt, opts);
  fn.json = async (prompt, opts) => parseJSON((await text(prompt, opts)).text);
  return fn;
}
async function placesMatch(dest, items) {
  if (!PLACES || !items.length) return null;
  try {
    const r = await fetch("/api/places/match", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ dest, items: items.map(i => ({ name: i.name, address: i.address || "", neighborhood: i.neighborhood || "", lat: hasLL(i) ? i.lat : null, lng: hasLL(i) ? i.lng : null })) }) });
    return r.ok ? (await r.json()).results : null;
  } catch (e) { return null; }
}
// Google's answer replaces Claude's guesses for location, hours and address.
function applyPlace(o, g) {
  if (!g) { o.verified = false; return o; }
  Object.assign(o, { verified: true, placeId: g.id, address: g.address || o.address, lat: g.lat, lng: g.lng, rating: g.rating, ratingCount: g.ratingCount, photo: g.photo, mapsUrl: g.mapsUrl, gStatus: g.status });
  if (g.hours) { o.hours = g.hours; o.hoursFrom = "google"; }
  return o;
}
const closedOnGoogle = o => o.gStatus === "CLOSED_PERMANENTLY" || o.gStatus === "CLOSED_TEMPORARILY";
async function enrichTrip(t) {
  const known = {};
  if (t.plan) t.plan.cands.forEach(c => { if (c.verified) known[c.name.toLowerCase()] = c; });
  const todo = [];
  t.days.forEach(d => d.items.forEach(it => {
    if (["transit", "free", "lodging"].includes(it.kind)) return;
    const k = known[it.name.toLowerCase()];
    if (k) applyPlace(it, { id: k.placeId, address: k.address, lat: k.lat, lng: k.lng, rating: k.rating, ratingCount: k.ratingCount, photo: k.photo, mapsUrl: k.mapsUrl, status: k.gStatus, hours: k.hoursFrom === "google" ? k.hours : null });

  }));
  if (t.homeBase && t.homeBase.name) todo.push(t.homeBase);
  const res = await placesMatch(t.destination, todo);
  if (res) todo.forEach((o, i) => applyPlace(o, res[i]));

  if (S.trip && S.trip.id === t.id && S.view === "trip") render();
}
function renderLogin() {

  return '<div class="wrap login"><span class="eyebrow">Mytinerary · invite only</span><h1 class="pf-title">Plan trips around what you love.</h1>' +
    '<p class="lede">Enter the email you were invited with and we\'ll send you a sign-in link.</p>' +
    (expired ? '<p class="err">That sign-in link expired or was already used. Ask for a new one below.</p>' : "") +
    '<form id="loginForm" class="look"><label for="loginEmail" class="hidden">Email</label><input id="loginEmail" type="email" autocomplete="email" required placeholder="you@example.com"><button class="btn primary" type="submit">Email me a link</button></form>' +
    '<p class="note" id="loginNote" role="status"></p></div>';
}
function bindLogin() {
  $("#loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const note = $("#loginNote"), email = $("#loginEmail").value.trim();
    note.textContent = "Sending…";
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email }) });
      const j = await r.json().catch(() => ({}));
      note.textContent = r.ok ? "If " + email + " is on the invite list, a sign-in link is on its way. It works once, for 20 minutes. Check spam if you don't see it." : (j.error || "That didn't work. Try again.");
    } catch (err) { note.textContent = "Couldn't reach the server. Check your connection and try again."; }
  });
}
function updateWho() {
  const w = $("#who");
  w.classList.toggle("hidden", !(HOSTED && ME));
  if (!(HOSTED && ME) || w.dataset.me === ME) return;
  w.dataset.me = ME;
  w.innerHTML = '<span class="em">' + esc(ME) + '</span><button class="lnk" type="button" id="logoutBtn">Sign out</button>';
  $("#logoutBtn").addEventListener("click", () => fetch("/api/logout", { method: "POST" }).finally(() => location.replace("/")));
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LINE = ["--l1", "--l2", "--l3", "--l4", "--l5", "--l6", "--l7"];
const lineVar = i => "var(" + LINE[i % LINE.length] + ")";
const BUDGET_TARGET = { Budget: 200, "Mid-range": 300, Splurge: 500 }; // per person per day, from the 2020 deck
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function fmtDay(s) { const d = parseDate(s); return d ? DOW[d.getDay()] + " " + MON[d.getMonth()] + " " + d.getDate() : s || ""; }
function fmtRange(a, b) {

function savedTrips() { return store("mytin.trips") || []; }
function saveTrip(t) {
  if (!t || t.example) return;
  const list = savedTrips().filter(x => x.id !== t.id);
  list.unshift(t);
  store("mytin.trips", list.slice(0, 12));
}
function normalize(t) {
  t.id = t.id || uid();
  t.travelers = Math.max(1, parseInt(t.travelers, 10) || 1);
  t.days = Array.isArray(t.days) ? t.days : [];
  t.days.forEach(d => {
    d.items = Array.isArray(d.items) ? d.items : [];
    d.items.forEach(normItem);
  });
  t.homeBase = t.homeBase || {};
  const hb = t.homeBase;
  hb.lat = Number(hb.lat); hb.lng = Number(hb.lng); hb.nightly = Number(hb.nightly) || 0; hb.booked = !!hb.booked;
  hb.alternatives = Array.isArray(hb.alternatives) ? hb.alternatives : [];
  hb.routine = Array.isArray(hb.routine) ? hb.routine : [];
  t.watchouts = Array.isArray(t.watchouts) ? t.watchouts : [];
  t.booked = t.booked || {};
  return t;
}
function normItem(it) {
  it.id = it.id || uid();
  it.lat = it.lat == null || it.lat === "" ? NaN : Number(it.lat);
  it.lng = it.lng == null || it.lng === "" ? NaN : Number(it.lng);
  it.cost = Number(it.cost) || 0;
  it.kind = String(it.kind || "activity").toLowerCase();
  it.booked = it.booked === true || it.booked === "true";
  it.anchor = it.anchor === true || it.anchor === "true";
  it.booking = String(it.booking || "none").toLowerCase().replace(/[^a-z]/g, "");
  if (!BOOK.hasOwnProperty(it.booking)) it.booking = "none";
  if (it.transitFromPrev && !Number.isFinite(Number(it.transitFromPrev.minutes))) it.transitFromPrev = null;
  return it;
}

/* ---------- Routing ---------- */
function route() {
  const h = location.hash.replace("#", "");
  S.view = h === "plan" ? "plan" : h === "profile" ? "profile" : (h === "wish" || h === "anchors") ? (DRAFT ? h : "plan") : (S.gen ? "gen" : "trip");
  if (S.view === "anchors" && !DRAFT.suggested && !Object.keys(DRAFT.place).length && DRAFT.wish.length) { suggestPlan(false); DRAFT.suggested = true; saveDraft(); }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- Render ---------- */
function render(fresh) {
  if (!fresh && $("#planForm")) readForm(); // keep unsent form edits across re-renders
  const app = $("#app");
  const bs = $(".board-scroll"), bsl = bs ? bs.scrollLeft : 0;
  updateWho();
  if (HOSTED && !ME) { app.innerHTML = renderLogin(); bindLogin(); return; }
  if (S.view === "plan") app.innerHTML = renderPlan();
  else if (S.view === "wish") app.innerHTML = renderWish();
  else if (S.view === "anchors") app.innerHTML = renderAnchors();
  else if (S.view === "gen" && S.gen) app.innerHTML = renderGen();
  else if (S.view === "profile") app.innerHTML = renderProfile();
  else app.innerHTML = renderTrip();
  if (S.view === "plan") bindPlan();
  if (S.view === "profile") bindProfile();
  if (S.view === "wish") bindWish();
  if (S.view === "anchors") bindAnchors();
  if ($(".board-scroll")) $(".board-scroll").scrollLeft = bsl;
  if (S.view === "trip") bindTrip();
  renderTripsMenu();
}

  const c = lineVar(S.day);

    ? '<div class="banner"><strong>Example trip.</strong> This is the 2020 San Francisco test itinerary from your template, rebuilt in the new format. <a class="btn small primary" href="#plan">Plan your own</a>' + (S.scan.trips.length ? "" : '<a class="btn small" href="#plan">Already booked? Start from Gmail &amp; Calendar</a>') + "</div>"

function routeLink(d) {
  const pts = d.items.filter(it => plotted(it) && it.kind !== "lodging").map(it => it.address || (it.name + ", " + (it.neighborhood || "")));
  if (pts.length < 2) return "";
  const enc = encodeURIComponent;
  const way = pts.slice(1, -1).slice(0, 8).map(enc).join("%7C");
  const url = "https://www.google.com/maps/dir/?api=1&origin=" + enc(pts[0]) + "&destination=" + enc(pts[pts.length - 1]) + (way ? "&waypoints=" + way : "") + "&travelmode=walking";
  return '<a class="btn small" href="' + url + '" target="_blank" rel="noopener">Open day in Google Maps</a>';
}

function stopNumbers(d) {
  let n = 0; const map = {};
  d.items.forEach(it => { if (plotted(it) && it.kind !== "lodging") map[it.id] = ++n; });
  return map;
}

function renderTimeline(d, di) {
  const c = lineVar(di);
  const nums = stopNumbers(d);
  let html = '<div class="timeline" style="--c:' + c + '">';
  d.items.forEach((it, ii) => {
    const tr = it.transitFromPrev;
    if (tr && ii > 0) {
      html += '<div class="leg"><span></span><span class="rail-col"></span><span class="txt">' + esc(MODE[tr.mode] || tr.mode || "Travel") + " · " + Math.round(Number(tr.minutes)) + " min</span></div>";
    }
    const minor = it.kind === "transit" || it.kind === "lodging";
    const num = nums[it.id];
    const node = it.kind === "lodging" ? '<span class="node minor home"></span>' : minor ? '<span class="node minor"></span>' : '<span class="node">' + (num || "") + "</span>";
    const cls = "card" + (it.kind === "free" ? " free" : "") + (minor ? " transitk" : "") + (S.hl === it.id ? " hl" : "");
    let body = '<span class="cat">' + esc(it.category || it.kind) + (it.neighborhood ? " · " + esc(it.neighborhood) : "") + "</span>" +
      '<span class="name">' + esc(it.name) + "</span>";
    if (it.why) body += '<span class="why">' + esc(it.why) + "</span>";
    if (it.tip) body += '<span class="tip"><b>Pro tip</b>' + esc(it.tip) + "</span>";
    if (minor && it.booked) body += '<div class="foot"><span class="pill booked">Booked</span></div>';
    if (!minor) {
      const foot = [];
      if (it.anchor) foot.push('<span class="pill pick">Your pick</span>');
      if (typeof it.rating === "number") foot.push('<span class="pill">★ ' + it.rating.toFixed(1) + "</span>");
      if (it.gStatus === "CLOSED_PERMANENTLY" || it.gStatus === "CLOSED_TEMPORARILY") foot.push('<span class="pill now">Google lists it as closed</span>');
      else if (it.hours && it.time) { const w = openCheck({ hours: it.hours, minutes: Math.max(15, (toMin(it.end) ?? toMin(it.time) + 60) - toMin(it.time)) }, d.date, toMin(it.time)); if (w) foot.push('<span class="pill daybefore">⚠ ' + esc(w) + "</span>"); }
      if (it.verified === false) foot.push('<span class="pill daybefore">Not found on Google Maps</span>');
      if (it.cost) foot.push('<span class="pill">' + esc(it.costTier || "") + (it.costTier ? " · " : "") + "~" + money(it.cost) + "/person</span>");
      if (it.booked) foot.push('<span class="pill booked">Booked</span>');
      else if (BOOK[it.booking]) foot.push('<span class="pill ' + it.booking + '">' + BOOK[it.booking] + "</span>");
      const q = encodeURIComponent((it.address || it.name + " " + (it.neighborhood || "") + " " + (S.trip.destination || "")).trim());
      foot.push('<a class="lnk" href="' + (it.mapsUrl ? esc(it.mapsUrl) : "https://www.google.com/maps/search/?api=1&query=" + q) + '" target="_blank" rel="noopener">Map</a>');
      foot.push('<a class="lnk" href="' + gcalLink(it, d) + '" target="_blank" rel="noopener">Add to calendar</a>');
      foot.push('<button class="lnk" data-swap="' + ii + '">Swap</button>');
      body += '<div class="foot">' + foot.join("") + "</div>";
    }
    html += '<div class="stop" data-id="' + it.id + '">' +
      '<span class="time">' + esc(fmtTime(it.time)) + (it.end ? "<small>to " + esc(fmtTime(it.end)) + "</small>" : "") + "</span>" +
      '<span class="rail-col">' + node + "</span>" +
      '<div class="' + cls + '">' + body + "</div></div>";
  });
  return html + "</div>";
}

function gcalLink(it, d) {
  const day = (d.date || "").replace(/-/g, "");
  const t0 = (it.time || "09:00").replace(":", "") + "00";
  const t1 = ((it.end || addMin(it.time || "09:00", 60)) || "10:00").replace(":", "") + "00";
  const details = [it.why, it.tip ? "Pro tip: " + it.tip : ""].filter(Boolean).join("\n\n") + "\n\nPlanned with Mytinerary";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent((it.category ? it.category + ": " : "") + it.name) +
    "&dates=" + day + "T" + t0 + "/" + day + "T" + t1 +
    "&details=" + encodeURIComponent(details) +
    "&location=" + encodeURIComponent(it.address || it.name);
}

function projection(pts, W, H, P) {
  let minLa = Infinity, maxLa = -Infinity, minLo = Infinity, maxLo = -Infinity;
  pts.forEach(p => { minLa = Math.min(minLa, p.lat); maxLa = Math.max(maxLa, p.lat); minLo = Math.min(minLo, p.lng); maxLo = Math.max(maxLo, p.lng); });
  const midLa = (minLa + maxLa) / 2, k = Math.cos(midLa * Math.PI / 180);
  const spanX = Math.max((maxLo - minLo) * k, 0.004), spanY = Math.max(maxLa - minLa, 0.004);
  const sc = Math.min((W - 2 * P) / spanX, (H - 2 * P) / spanY);
  const ox = (W - spanX * sc) / 2, oy = (H - spanY * sc) / 2;
  const cx = (minLo + maxLo) / 2;
  const X = lng => ox + ((lng - cx) * k + spanX / 2) * sc;
  const Y = lat => oy + (maxLa - lat) * sc;
  return { X, Y, sc };
}

/* Map: no basemap tiles are allowed in the page, so stops are projected onto a plain grid, like a transit diagram. */
function renderMap(t) {
  const pts = [];
  const hb = t.homeBase;
  if (Number.isFinite(hb.lat) && Number.isFinite(hb.lng)) pts.push({ lat: hb.lat, lng: hb.lng });
  t.days.forEach(d => d.items.forEach(it => { if (plotted(it)) pts.push(it); }));
  if (pts.length < 2) return "";
  const W = 600, H = 440, P = 40;
  const { X, Y, sc } = projection(pts, W, H, P);
  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Map of stops by day">';
  for (let gx = 0; gx <= W; gx += 40) svg += '<line class="gridl" x1="' + gx + '" y1="0" x2="' + gx + '" y2="' + H + '"/>';
  for (let gy = 0; gy <= H; gy += 40) svg += '<line class="gridl" x1="0" y1="' + gy + '" x2="' + W + '" y2="' + gy + '"/>';
  // scale bar: km per px
  const kmPerDegLat = 111.32;
  const kmPerPx = kmPerDegLat / sc;
  const nice = [0.25, 0.5, 1, 2, 5, 10, 20, 50, 100, 200];
  let km = nice.find(n => n / kmPerPx >= 70) || 200;
  const bar = km / kmPerPx;
  svg += '<g transform="translate(' + (W - P - bar) + "," + (H - 18) + ')"><line x1="0" y1="0" x2="' + bar + '" y2="0" stroke="var(--ink)" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="4" stroke="var(--ink)" stroke-width="2"/><line x1="' + bar + '" y1="-4" x2="' + bar + '" y2="4" stroke="var(--ink)" stroke-width="2"/><text x="' + (bar / 2) + '" y="-8" text-anchor="middle">' + km + " km · " + (Math.round(km * 0.621 * 10) / 10) + " mi</text></g>";
  svg += '<g transform="translate(24,30)"><text x="0" y="0" text-anchor="middle" style="font-weight:600;fill:var(--ink)">N</text><path d="M0 6 L5 20 L0 16 L-5 20 Z" fill="var(--ink)"/></g>';
  const order = t.days.map((_, i) => i).filter(i => i !== S.day).concat([S.day]);
  order.forEach(di => {
    const d = t.days[di];
    const ps = d.items.filter(it => plotted(it) && it.kind !== "lodging");
    const sel = di === S.day;
    const col = lineVar(di);
    if (ps.length > 1) {
      svg += '<polyline fill="none" stroke="' + col + '" stroke-width="' + (sel ? 6 : 3) + '" stroke-linejoin="round" stroke-linecap="round" opacity="' + (sel ? 1 : 0.22) + '" points="' + ps.map(p => X(p.lng).toFixed(1) + "," + Y(p.lat).toFixed(1)).join(" ") + '"/>';
    }
    if (sel) {
      const nums = stopNumbers(d);
      ps.forEach(p => {
        const x = X(p.lng), y = Y(p.lat), on = S.hl === p.id;
        svg += '<g class="stop-c" data-id="' + p.id + '"><title>' + esc(p.name) + '</title><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (on ? 14 : 11) + '" fill="var(--card)" stroke="' + col + '" stroke-width="4"/>' +
          '<text x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="middle" style="fill:var(--ink);font-weight:600">' + nums[p.id] + "</text></g>";
      });
    } else {
      ps.forEach(p => { svg += '<circle cx="' + X(p.lng).toFixed(1) + '" cy="' + Y(p.lat).toFixed(1) + '" r="3.5" fill="' + col + '" opacity="0.35"/>'; });
    }
  });
  if (Number.isFinite(hb.lat)) {
    const x = X(hb.lng), y = Y(hb.lat);
    svg += '<g><title>' + esc(hb.name) + '</title><rect x="' + (x - 9) + '" y="' + (y - 9) + '" width="18" height="18" rx="3" fill="var(--ink)"/><text x="' + (x + 14) + '" y="' + (y + 4) + '" style="fill:var(--ink);font-weight:600">' + esc(hb.name) + "</text></g>";
  }
  svg += "</svg>";
  const legend = t.days.map((d, i) => '<span style="--c:' + lineVar(i) + '"><i></i>Day ' + (i + 1) + "</span>").join("") + '<span><i style="background:var(--ink);width:10px;height:10px"></i>Home base</span>';
  return '<section class="panel map"><h3>Trip map <small>numbers match the day\'s stops</small></h3>' + svg + '<div class="map-legend">' + legend + "</div></section>";
}

function renderBookings(t) {
  const groups = { booked: [], now: [], daybefore: [], walkin: [] };
  if (t.homeBase.name) groups[t.homeBase.booked ? "booked" : "now"].push({ id: "home", name: t.homeBase.name, day: "Stay" });
  t.days.forEach((d, di) => d.items.forEach(it => {
    const g = it.booked ? "booked" : it.booking;

  }));
  const meta = { booked: ["Already booked", "var(--good)"], now: ["Book now", "var(--accent)"], daybefore: ["Book the day before", "var(--warn)"], walkin: ["Walk in, no reservation", "var(--muted)"] };
  const total = groups.now.length + groups.daybefore.length;

  let html = '<section class="panel"><h3>What to book <small>' + done + " of " + total + " done</small></h3>";
  Object.keys(groups).forEach(k => {

      else if (k === "walkin") html += '<div class="bk"><span></span><span>' + esc(x.name) + "</span><em>" + x.day + "</em></div>";
      else html += '<label class="bk' + (t.booked[x.id] ? " done" : "") + '"><input type="checkbox" data-book="' + x.id + '"' + (t.booked[x.id] ? " checked" : "") + "><span>" + esc(x.name) + "</span><em>" + x.day + "</em></label>";
    });

}

function renderBudget(t) {
  const target = BUDGET_TARGET[t.budget] || 300;
  const rooms = Math.ceil(t.travelers / 2);
  const lodgePP = (t.homeBase.nightly || 0) * rooms / t.travelers;
  const rows = t.days.map((d, i) => {
    const food = d.items.filter(isMeal).reduce((a, it) => a + it.cost, 0);
    const act = d.items.filter(it => !isMeal(it)).reduce((a, it) => a + it.cost, 0);
    const lodge = i < t.days.length - 1 || t.days.length === 1 ? lodgePP : 0;
    return { lodge, food, act, total: lodge + food + act };
  });
  const max = Math.max(target * 1.25, ...rows.map(r => r.total));
  const avg = rows.reduce((a, r) => a + r.total, 0) / rows.length;
  const trip = rows.reduce((a, r) => a + r.total, 0);
  const diff = avg - target;
  const verdict = Math.abs(diff) < target * 0.08 ? "right on budget" : diff > 0 ? money(diff) + " over your " + money(target) + " target" : money(-diff) + " under your " + money(target) + " target";
  let html = '<section class="panel"><h3>Budget check <small>per person, before flights</small></h3>' +
    '<div class="bud-sum"><strong>' + money(avg) + '<span class="small muted" style="font-family:var(--body);font-weight:400"> / day</span></strong>' + esc(verdict) + " · " + money(trip) + " for the trip</div>";
  rows.forEach((r, i) => {
    const w = v => (v / max * 100).toFixed(1) + "%";
    html += '<div class="bud-row"><span class="lab">Day ' + (i + 1) + '</span><div class="bar" title="Lodging ' + money(r.lodge) + ", food " + money(r.food) + ", activities " + money(r.act) + '">' +
      '<span style="width:' + w(r.lodge) + ';background:var(--ink)"></span><span style="width:' + w(r.food) + ';background:' + lineVar(0) + '"></span><span style="width:' + w(r.act) + ';background:' + lineVar(1) + '"></span>' +
      '<span class="target" style="left:' + w(target) + '"></span></div><span class="amt">' + money(r.total) + "</span></div>";
  });
  html += '<div class="bud-key"><span><i style="background:var(--ink)"></i>Lodging</span><span><i style="background:' + lineVar(0) + '"></i>Food &amp; drink</span><span><i style="background:' + lineVar(1) + '"></i>Activities</span><span><i style="background:var(--ink);width:2px"></i>Target</span></div>';
  return html + "</section>";
}

function bindTrip() {
  const ep = $("#editPlan");
  if (ep) ep.addEventListener("click", () => { DRAFT = JSON.parse(JSON.stringify(S.trip.plan)); DRAFT.tripId = S.trip.id; DRAFT.suggested = true; saveDraft(); });
  document.querySelectorAll(".line-tab").forEach(b => b.addEventListener("click", () => { S.day = +b.dataset.day; S.hl = null; render(); }));
  document.querySelectorAll("[data-swap]").forEach(b => b.addEventListener("click", () => openSwap(S.day, +b.dataset.swap)));
  document.querySelectorAll("[data-book]").forEach(cb => cb.addEventListener("change", () => {
    S.trip.booked[cb.dataset.book] = cb.checked; saveTrip(S.trip); render();
  }));
  const hl = id => {
    S.hl = id;
    document.querySelectorAll(".card.hl").forEach(c => c.classList.remove("hl"));
    const card = document.querySelector('.stop[data-id="' + id + '"] .card');
    if (card && !card.classList.contains("transitk")) card.classList.add("hl");
    document.querySelectorAll(".stop-c circle").forEach(c => c.setAttribute("r", "11"));
    const dot = document.querySelector('.stop-c[data-id="' + id + '"] circle');
    if (dot) dot.setAttribute("r", "14");
  };
  document.querySelectorAll(".stop").forEach(s => s.addEventListener("mouseenter", () => hl(s.dataset.id)));
  document.querySelectorAll(".stop-c").forEach(g => g.addEventListener("click", () => {
    hl(g.dataset.id);
    const el = document.querySelector('.stop[data-id="' + g.dataset.id + '"]');
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }));
  const rf = $("#reworkForm");
  if (rf) rf.addEventListener("submit", e => { e.preventDefault(); reworkDay(); });
  const ct = $("#copyText");
  if (ct) ct.addEventListener("click", copyText);
  const del = $("#delTrip");
  if (del) del.addEventListener("click", () => {
    store("mytin.trips", savedTrips().filter(x => x.id !== S.trip.id));
    S.trip = normalize(JSON.parse(JSON.stringify(EXAMPLE))); S.day = 0;
    toast("Removed from My trips"); render();
  });
}

function copyText() {
  const t = S.trip;
  const lines = [t.destination.toUpperCase() + " · " + fmtRange(t.startDate, t.endDate), t.summary, ""];
  if (t.homeBase.name) lines.push("Staying at: " + t.homeBase.name + (t.homeBase.neighborhood ? " (" + t.homeBase.neighborhood + ")" : ""), "");
  t.days.forEach((d, i) => {
    lines.push("DAY " + (i + 1) + " · " + fmtDay(d.date) + " · " + d.title);
    d.items.forEach(it => lines.push("  " + fmtTime(it.time).padEnd(9) + it.name + (it.category ? " (" + it.category + ")" : "")));
    lines.push("");
  });
  lines.push("Planned with Mytinerary");
  const txt = lines.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => toast("Itinerary copied. Paste it into your group chat."), () => toast("Your browser blocked copying here."));
  } else toast("Your browser blocked copying here.");
}

/* ---------- Generation ---------- */
const ITEM_SHAPE = '{"time":"HH:MM","end":"HH:MM","kind":"meal|activity|free|transit|lodging","category":"Breakfast|Lunch|Dinner|Drinks|Coffee|Tour|Museum|Outdoors|Shopping|Market|Show|Free time|Arrive|Depart|Check in|Check out","name":"Real place name","neighborhood":"...","address":"street address, city","lat":0.0,"lng":0.0,"why":"one sentence selling why this fits THEM","tip":"insider pro tip, specific and a little playful, or empty","cost":0,"costTier":"$|$$|$$$|$$$$","booking":"now|daybefore|walkin|none","booked":false,"anchor":false,"transitFromPrev":{"mode":"walk|transit|rideshare|drive|ferry|train","minutes":0}}';

function prefsText(p) {
  return [
    "Destination: " + p.dest,
    p.from ? "Traveling from: " + p.from : "",
    "Dates: " + p.start + " to " + p.end + " (" + (Math.round((parseDate(p.end) - parseDate(p.start)) / 864e5) + 1) + " days)",
    "Travelers: " + p.travelers + " · Trip type: " + (p.tripType || "unspecified") + " · Occasion: " + (p.occasion || "none"),

    p.leave ? "Leaving around " + p.leave + " on the last day" : "Departure time unknown; end the last day mid-afternoon",
    "Daily hours: start " + (p.dayStart || "09:00") + ", end " + (p.dayEnd || "22:00"),
    "Pace: " + p.pace + " (Relaxed = 1-2 activities plus meals and long free time; Moderate = 2-3 activities plus meals and one free block; Jam-packed = 4+ activities)",
    "Budget: " + p.budget + " (about $" + (BUDGET_TARGET[p.budget] || 300) + " per person per day including lodging share, excluding flights)",
    "Lodging preference: " + (p.lodging || "No preference"),
    "Interest levels 1-5: Food " + p.food + ", Culture/history " + p.culture + ", Outdoors/adventure " + p.outdoors + ", Drinks/nightlife " + p.nightlife + ", Shopping " + p.shopping,
    p.mustdo ? "Must-dos: " + p.mustdo : "",

        p.anchors.map(a => "- " + a.date + " " + a.start + "-" + a.end + " " + a.name + (a.neighborhood ? " (" + a.neighborhood + ")" : "")).join("\n")
      : "",
    p.spare && p.spare.length ? "Also on their wish list but not scheduled (add one only where it fits naturally near that day's anchors): " + p.spare.join("; ") : "",

function genPrompt(p) {
  return "You are the trip designer for Mytinerary, a service that turns a traveler's preferences into a finished, day-by-day itinerary so they skip the 25-100 hours of research. " +
    "Write like a well-traveled friend who lives there: specific, confident, no filler.\n\n" +
    "TRAVELER PREFERENCES\n" + prefsText(p) + "\n\n" +
    "RULES\n" +
    "- Use real, well-established places likely to still be open. Prefer local favorites over tourist traps unless the traveler asked for classics. Mix a few recognizable picks with a few surprises.\n" +
    "- Choose ONE home base first, placed so most stops are a short walk or ride away, then cluster each day geographically to minimize travel. Give accurate latitude/longitude for every place.\n" +
    "- Meals are fixed points in time; activities flex between them. Include breakfast/coffee, lunch, dinner each full day, drinks if nightlife >= 3. Respect daily start/end hours and dietary needs.\n" +
    "- Include free-time blocks (kind \"free\") so the day can breathe. Day 1 starts with an Arrive item (kind \"transit\", no lat/lng) and Check in (kind \"lodging\" with the home base coords). The last day ends with Check out (kind \"lodging\") and Depart (kind \"transit\", no lat/lng).\n" +
    "- Every item after the first has transitFromPrev with a realistic mode and minutes. Order items by time; no overlaps.\n" +
    "- cost = estimated US dollars per person for that item (0 if free). booking: \"now\" for things that sell out (popular dinners, timed tours), \"daybefore\" for places that take reservations but rarely fill, \"walkin\" for no reservations, \"none\" for free time/transit/lodging steps.\n" +
    "- Day titles are 3-6 words. Each day's pitch is a 1-2 sentence elevator pitch of what that day is about.\n" +
    "- homeBase.routine: 3 go-to spots near the home base (Coffee, a late bite or fallback dinner, and one practical stop such as a market or pharmacy).\n" +
    "- watchouts: 2-4 timely, specific heads-ups (sell-outs, closures by weekday, weather, local events or crowds on these dates).\n" +
    "- If ALREADY BOOKED items are listed, they are fixed. Use the booked lodging as homeBase (same name and address, accurate lat/lng, estimated nightly price, \"booked\": true, empty alternatives). Day 1 Arrive and last-day Depart items name the actual flight or train and station at the booked local times. Put booked restaurants or events at their booked times. Set \"booked\": true on every item that matches an existing booking.\n\n" +
    "Reply with ONLY one JSON object, no prose, in this shape:\n" +

    "Provide exactly one day object per date from " + p.start + " to " + p.end + ", with 2 homeBase.alternatives.";

let genCtl = null;
async function generate(p) {
  genCtl = new AbortController();
  S.gen = { dest: p.dest, pct: 4, stops: [], status: "Asking Claude. You may see a prompt to allow it." };
  location.hash = "trip";
  S.view = "gen"; render();
  const days = Math.round((parseDate(p.end) - parseDate(p.start)) / 864e5) + 1;
  const expected = days * 8;
  try {
    const raw = await sampleFn.json(genPrompt(p), {
      signal: genCtl.signal,
      modelTier: "default",
      onText: ({ text }) => {
        const names = [];
        const re = /"name"\s*:\s*"([^"]{2,80})"/g; let m;
        while ((m = re.exec(text))) names.push(m[1]);
        const dayCount = (text.match(/"pitch"\s*:/g) || []).length;
        S.gen.stops = names.slice(1);
        S.gen.pct = Math.min(96, 8 + names.length / (expected + 4) * 88);
        S.gen.status = dayCount ? "Drawing day " + Math.min(dayCount, days) + " of " + days : "Choosing a home base";
        updateGen();
      }
    });
    if (!raw || !Array.isArray(raw.days) || !raw.days.length) throw { code: "invalid_json", message: "No days came back" };
    const trip = normalize(Object.assign(raw, {
      id: p.tripId || uid(), startDate: p.start, endDate: p.end, travelers: p.travelers, tripType: p.tripType, pace: p.pace, budget: p.budget, occasion: p.occasion,
      destination: raw.destination || p.dest, prefs: p, created: new Date().toISOString(),
      plan: p.anchors && DRAFT ? JSON.parse(JSON.stringify(DRAFT)) : null,
      scanKey: p.booked && p.booked.startDate ? p.booked.destination + "|" + p.booked.startDate : null
    }));
    S.trip = trip; S.day = 0; S.gen = null;
    saveTrip(trip); store("mytin.lastOpened", trip.id);
    if (PLACES) enrichTrip(trip);
    if (p.anchors && DRAFT) { DRAFT.tripId = trip.id; saveDraft(); }
    if (FORM.booked) { FORM.booked = null; store("mytin.form", FORM); } // the next new trip starts clean
    if (hasProfile()) applyProfileToForm(); // ...from the profile, not this trip's tweaks
    S.view = "trip"; render(); window.scrollTo(0, 0);
    toast("Your trip is ready and saved to My trips.");
  } catch (e) {
    S.gen = null;
    if (e && e.code === "not_granted") sampleBlocked = true;
    S.formError = e && e.code === "cancelled" ? "" : genErrorCopy(e);
    location.hash = p.anchors ? "anchors" : "plan";
    if (p.anchors && S.formError) { toast(S.formError); S.formError = ""; }
    if (S.view === "plan") render();
  }
}
function genErrorCopy(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled") return "Claude access isn't allowed for this page, so it can't build trips.";
  if (c === "rate_limited") return "You've hit a usage limit. Try again in a few minutes.";
  if (c === "invalid_json") return "Claude's answer didn't come back in a usable shape. Try again.";
  if (c === "refused") return "Claude declined that request. Try rewording your notes.";
  return "Something went wrong building the trip. Try again.";
}

/* ---------- Start from Gmail & Google Calendar ---------- */
// Calendar's "from Gmail" events carry flights and stays with exact times and addresses, so they lead.
// Gmail search is a backup for lodging that never reached the calendar.
const GMAIL_Q = 'newer_than:9m (category:reservations OR subject:("your trip" OR "your stay" OR "flight is booked" OR "reservation confirmed" OR "booking confirmation" OR itinerary OR "your reservation")) -category:promotions -category:social';
const TRAVEL_RE = /flight|trip|travel|vacation|holiday|hotel|stay at|airbnb|vrbo|check[- ]?in|reservation|train|ferry|cruise|out of office|ooo|pto|✈/i;
function localISO(d) { return isoDate(d) + "T" + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":00"; }
function decodeEntities(s) { const t = document.createElement("textarea"); t.innerHTML = String(s || ""); return t.value; }
function asObj(payload) { if (typeof payload === "string") { try { return JSON.parse(payload); } catch (e) { return {}; } } return payload || {}; }

function compactEvents(payload) {
  const evs = asObj(payload).events || [];
  return evs.filter(e => {
    if (e.eventType === "FROM_GMAIL") return true;
    const allDayMulti = e.start && e.start.date && e.end && e.end.date && (parseDate(e.end.date) - parseDate(e.start.date)) / 864e5 >= 2;
    return allDayMulti || TRAVEL_RE.test((e.summary || "") + " " + (e.location || ""));
  }).slice(0, 120).map(e => ({
    title: e.summary || "", start: (e.start && (e.start.dateTime || e.start.date)) || "", end: (e.end && (e.end.dateTime || e.end.date)) || "",
    where: e.location || "", fromGmail: e.eventType === "FROM_GMAIL"
  }));
}
function compactThreads(payload) {
  const th = asObj(payload).threads || [];
  return th.slice(0, 30).map(t => {
    const m = (t.messages || [])[0] || {};
    const from = (m.addressDisplayNames && m.addressDisplayNames[0] && m.addressDisplayNames[0].displayName) || m.sender || "";
    return { id: t.id, date: (m.date || "").slice(0, 10), from, subject: decodeEntities(m.subject), snippet: decodeEntities(m.snippet).replace(/\s+/g, " ").slice(0, 180) };
  });
}
function connectorNote(server, e) {
  const c = e && e.code;
  if (c === "server_not_connected" || c === "server_not_found") return server + " isn't connected. Add it in claude.ai Settings → Connectors, then try again.";
  if (c === "needs_reauth") return server + " needs to be reconnected in claude.ai Settings → Connectors.";
  if (c === "not_in_manifest" || c === "approval_required") return "You didn't allow " + server + " for this page. Try again and choose Allow to include it.";
  if (c === "selection_required") return "You have more than one " + server + " connected. Choose one when claude.ai asks, then try again.";
  if (c === "blocked_by_policy") return "Your organization blocks " + server + " here.";
  if (c === "server_unavailable" || (e && e.retryable)) return server + " didn't respond. Try again in a minute.";
  if (c === "not_granted" || c === "capability_disabled") return "Connectors aren't available in this view.";
  return "Couldn't read " + server + ".";
}

function scanPrompt(events, threads) {

    "CALENDAR EVENTS (next 12 months; timestamps carry their UTC offset; fromGmail events were created from booking emails)\n" +

    "Group related bookings into trips: an outbound flight, a stay and a return flight usually form one trip; layover cities are not destinations. " +
    "Infer the traveler's home city from where round trips start and end, and skip anything happening in the home city. A stay with no flights (a road trip) is still a trip.\n" +
    "startDate is the arrival date at the destination; endDate is the departure date. arriveTime and leaveTime are LOCAL times at the destination (convert using the offsets), or \"\" if unknown.\n" +
    "Do not include confirmation codes, prices or passenger details.\n" +
    "Reply with ONLY JSON:\n" +

}

let scanRunning = false, autoTried = false;
async function scanTrips(auto) {
  if (scanRunning || !mcpApi || !sampleFn) return;
  scanRunning = true;
  S.scan = { state: "running", step: "Reading travel events from Google Calendar…", trips: [], notes: [], err: "", picking: null, homeCity: "", auto: !!auto };
  render();
  const now = new Date(), later = new Date(now.getFullYear() + 1, now.getMonth(), now.getDate());
  const cache = { staleTime: 30 * 60e3, gcTime: 24 * 3600e3 };

// The usable part of a day: daily hours, minus landing on day 1 and getting to the airport on the last day.
function dayWindow(di, n) {
  const p = DRAFT.prefs;
  let s = toMin(p.dayStart) ?? 540, e = toMin(p.dayEnd) ?? 1320;
  if (e <= s) e = Math.min(s + 600, 1439);
  let blockBefore = null, blockAfter = null;
  if (di === 0 && toMin(p.arrive) != null) { blockBefore = toMin(p.arrive) + 90; s = Math.max(s, blockBefore); }
  if (di === n - 1 && toMin(p.leave) != null) { blockAfter = Math.max(toMin(p.leave) - 150, 0); e = Math.min(e, blockAfter); }
  return { s, e, blockBefore, blockAfter };
}
function gridRange() {
  const p = DRAFT.prefs;
  const gs = Math.max(0, Math.floor((toMin(p.dayStart) ?? 540) / 60) * 60 - 60);
  const ge = Math.min(1440, Math.ceil((toMin(p.dayEnd) ?? 1320) / 60) * 60 + 60);
  return { gs, ge: Math.max(ge, gs + 360) };
}

/* Opening hours: Claude's typical weekly hours, e.g. {"mon":"closed","tue":"10:00-17:00,18:00-22:00"}. Unknown = no warning. */
function hoursOn(c, date) {
  const h = c.hours && c.hours[WD[parseDate(date).getDay()]];
  if (h == null || String(h).trim() === "") return null;
  if (/closed/i.test(h)) return [];
  const out = [];
  String(h).split(/[,;]/).forEach(r => {
    const m = /(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/.exec(r); if (!m) return;
    const a = toMin(m[1]); let b = toMin(m[2]); if (b <= a) b += 1440;
    out.push([a, b]);
  });
  return out.length ? out : null;
}
function openCheck(c, date, start) {
  const iv = hoursOn(c, date);
  if (!iv) return "";
  if (!iv.length) return "Usually closed on " + WD_NAME[WD[parseDate(date).getDay()]];
  const end = start + c.minutes;
  if (iv.some(([a, b]) => start >= a && end <= b)) return "";
  const cur = iv.find(([a, b]) => start >= a && start < b);
  if (cur) return "Usually closes at " + fmtShort(cur[1]);
  const later = iv.find(([a]) => a > start);
  if (later) return "Usually opens at " + fmtShort(later[0]);
  return "Usually closes at " + fmtShort(iv[iv.length - 1][1]);
}
function hoursSummary(c) {
  if (!c.hours) return "";
  const val = k => String(c.hours[k] || "").trim();
  if (WD_ORDER.every(k => !val(k))) return "";
  const closed = WD_ORDER.filter(k => /closed/i.test(val(k)));
  const open = WD_ORDER.map(val).filter(v => v && !/closed/i.test(v));
  const counts = {}; open.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  const main = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  const fmt = v => /^0?0:00\s*[-–]\s*24:00$/.test(v) ? "Open 24 hours" : v.split(/[,;]/).map(r => {
    const m = /(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/.exec(r); return m ? fmtShort(toMin(m[1])) + "–" + fmtShort(toMin(m[2])) : r.trim();
  }).join(", ");
  let s = main ? fmt(main) + (counts[main] < open.length ? " (varies)" : "") : "";
  if (closed.length) s += (s ? " · " : "") + "Closed " + closed.map(k => k[0].toUpperCase() + k.slice(1)).join(", ");
  return s;
}
// Problems with placing c on day di at start (minutes). buf pads the overlap check when auto-placing.
function issuesAt(c, di, start, buf) {
  const days = draftDays(), out = [], end = start + c.minutes;
  const oc = openCheck(c, days[di], start); if (oc) out.push(oc);
  const w = dayWindow(di, days.length);
  if (w.blockBefore != null && start < w.blockBefore) out.push("Before you'll be in town");
  if (w.blockAfter != null && end > w.blockAfter) out.push("Runs into your trip home");
  const clash = Object.keys(DRAFT.place).find(id => {
    const o = DRAFT.place[id], oc2 = candById(id);
    if (id === c.id || !oc2 || o.day !== di) return false;
    const os = toMin(o.start), oe = os + oc2.minutes;
    return start < oe + (buf || 0) && os < end + (buf || 0);
  });
  if (clash) out.push("Overlaps " + candById(clash).name);
  return out;
}

function normCand(c, mine) {
  const out = {
    id: uid(), name: String(c.name || "").trim(), category: CATS[c.category] ? c.category : "Experiences",
    neighborhood: String(c.neighborhood || ""), address: String(c.address || ""),
    lat: Number(c.lat), lng: Number(c.lng), why: String(c.why || ""), fitWhy: String(c.fitWhy || ""),
    fit: Math.max(0, Math.min(100, Math.round(Number(c.fit) || 0))),
    minutes: Math.max(30, Math.min(600, Math.round((Number(c.minutes) || 90) / SNAP) * SNAP)),
    bestTime: ["morning", "afternoon", "evening", "any"].includes(c.bestTime) ? c.bestTime : "any",
    hours: c.hours && typeof c.hours === "object" ? c.hours : null,
    cost: Number(c.cost) || 0, costTier: String(c.costTier || "").replace(/[^$]/g, ""),
    booking: BOOK.hasOwnProperty(c.booking) ? c.booking : "none", mine: !!mine
  };
  if (!hasLL(out) || (out.lat === 0 && out.lng === 0)) { out.lat = null; out.lng = null; }
  return out;
}

function candPrompt(p, exclude, count) {
  return "You are the local expert for Mytinerary. The traveler will pick a few anchor activities, one or two per day, and the rest of each day gets filled in around them. List the best things to do in " + p.dest + " for THIS traveler.\n\n" +
    "TRAVELER\n" + prefsText(p) + "\n\n" +
    "RULES\n" +
    "- Exactly " + count + " activities, best fit first. Real, well-established places likely to be open on these dates. Mix a few icons with local favorites.\n" +
    "- Match their tastes closely. Interests rated 1-2 get at most one item, and only a standout. Never suggest what they avoid. Lean into what they love.\n" +
    "- Anchors are worth planning a day around: sights, museums, hikes, markets, neighborhoods to wander, shows, tours, and destination restaurants only if food is a big interest. No ordinary meals, hotels or transit.\n" +
    "- Spread across several neighborhoods so each day can have its own area. Give accurate latitude/longitude.\n" +
    "- category: one of " + Object.keys(CATS).join(", ") + ".\n" +
    "- hours: typical opening hours for each weekday as \"HH:MM-HH:MM\" (24-hour; several ranges separated by commas; \"closed\" if closed that day; \"00:00-24:00\" for parks, streets and neighborhoods that are always open).\n" +
    "- minutes: typical visit length. bestTime: when it's best (morning | afternoon | evening | any).\n" +
    "- fit: 0-100 match to this traveler. fitWhy: 3-7 friendly words on why it suits them (\"For the hiker in you\").\n" +
    "- cost: US dollars per person (0 if free). booking: now (sells out) | daybefore | walkin | none.\n" +
    (exclude.length ? "- ALREADY LISTED, don't repeat: " + exclude.join("; ") + "\n" : "") +
    "\nReply with ONLY one JSON object, no prose:\n" +
    '{"homeBase":' + (p.stay ? '{"name":"","lat":0.0,"lng":0.0}' : "null") + ',"activities":[' + ACT_SHAPE + "]}" +
    (p.stay ? "\nhomeBase is where they're staying, with accurate coordinates." : "");
}
function wishErrorCopy(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled") return "Claude access isn't allowed for this page, so it can't find things to do.";
  if (c === "rate_limited") return "You've hit a usage limit. Try again in a few minutes.";
  if (c === "invalid_json") return "Claude's answer didn't come back in a usable shape. Try again.";
  return "Something went wrong finding things to do. Try again.";
}
const noClaudeCopy = what => sampleBlocked ? "Claude access was declined for this page. Reload to be asked again." : what + " needs Claude, which is available when this page is open on claude.ai.";

function startWish(p) {
  if (DRAFT && DRAFT.prefs.dest === p.dest && DRAFT.cands.length) {
    DRAFT.prefs = JSON.parse(JSON.stringify(p)); // same place: keep the ideas and picks, drop days that no longer exist
    const n = draftDays().length;
    Object.keys(DRAFT.place).forEach(id => { if (DRAFT.place[id].day >= n) delete DRAFT.place[id]; });
  } else {
    DRAFT = { id: uid(), prefs: JSON.parse(JSON.stringify(p)), cands: [], wish: [], place: {}, suggested: false, home: null, tripId: null };
    S.wishCat = "All";
  }
  saveDraft();
  location.hash = "wish";
  if (!DRAFT.cands.length) loadCandidates(false);
}
async function loadCandidates(more) {
  if (S.wishLoad && S.wishLoad.busy) return;
  if (!sampleFn) { S.wishLoad = { busy: false, names: [], err: noClaudeCopy("Finding things to do") }; render(); return; }
  const d = DRAFT;
  S.wishLoad = { busy: true, more: !!more, names: [], err: "" }; render();
  try {
    const raw = await sampleFn.json(candPrompt(d.prefs, more ? d.cands.map(c => c.name) : [], more ? 8 : 18), {
      modelTier: "default", cache: false,
      onText: ({ text }) => {
        if (!S.wishLoad) return;
        const names = []; const re = /"name"\s*:\s*"([^"]{2,80})"/g; let m;
        while ((m = re.exec(text))) names.push(m[1]);
        S.wishLoad.names = names.filter(x => !d.prefs.stay || x !== d.prefs.stay); updateWishLoad();
      }
    });
    const acts = raw && Array.isArray(raw.activities) ? raw.activities : null;
    if (!acts || !acts.length) throw { code: "invalid_json" };
    if (DRAFT !== d) return; // a different trip was started meanwhile
    const have = new Set(d.cands.map(c => c.name.toLowerCase()));
    let fresh = acts.map(c => normCand(c)).filter(c => c.name && !have.has(c.name.toLowerCase()));
    if (PLACES) {
      S.wishLoad.status = "Checking each place on Google Maps…"; updateWishLoad();
      const res = await placesMatch(d.prefs.dest, fresh);
      if (res) { fresh.forEach((c, i) => applyPlace(c, res[i])); fresh = fresh.filter(c => !closedOnGoogle(c)); }
      if (DRAFT !== d) return;
    }
    fresh.forEach(c => d.cands.push(c));
    const hb = raw.homeBase;
    if (hb && Number.isFinite(Number(hb.lat)) && Number(hb.lat) !== 0) d.home = { name: String(hb.name || d.prefs.stay), lat: Number(hb.lat), lng: Number(hb.lng) };
    saveDraft();
    S.wishLoad = null;
  } catch (e) {
    if (e && e.code === "not_granted") sampleBlocked = true;
    S.wishLoad = { busy: false, names: [], err: wishErrorCopy(e) };
  }
  if (S.view === "wish") render();
}
async function lookupPlace(q) {
  q = String(q || "").trim();
  if (!q || S.wishLook.busy) return;
  if (!sampleFn) { S.wishLook = { busy: false, err: noClaudeCopy("Looking up places") }; render(); return; }
  S.wishLook = { busy: true, err: "" }; render();
  try {
    const r = await sampleFn.json("You look up one place for Mytinerary. The traveler is going to " + DRAFT.prefs.dest + " and wants to add: " + q + "\n\n" +
      "If it's a real place, activity or area there, reply with ONLY JSON: {\"found\":true,\"activity\":" + ACT_SHAPE + "}\n" +
      "category is one of " + Object.keys(CATS).join(", ") + ". hours are typical weekly hours (\"10:00-17:00\", \"closed\", or \"00:00-24:00\" if always open). fitWhy can be empty. Otherwise reply {\"found\":false}.",
      { modelTier: "default", cache: false });
    if (!r || !r.found || !r.activity || !r.activity.name) S.wishLook = { busy: false, err: "Couldn't find \"" + q + "\" in " + DRAFT.prefs.dest + ". Try the full name." };
    else {
      const c = normCand(r.activity, true);
      if (PLACES) { const res = await placesMatch(DRAFT.prefs.dest, [c]); if (res) applyPlace(c, res[0]); }
      DRAFT.cands.unshift(c); DRAFT.wish.push(c.id); saveDraft();
      S.wishLook = { busy: false, err: "" }; S.wishCat = "All";
      toast("Added " + c.name + " to your wish list.");
    }
  } catch (e) {
    if (e && e.code === "not_granted") sampleBlocked = true;
    S.wishLook = { busy: false, err: wishErrorCopy(e) };
  }
  if (S.view === "wish") render();
}

// Lay out unplaced wish-list items: hardest-to-fit first, each to the day whose picks are closest, capped by pace.
function findSlot(c, di) {
  const w = dayWindow(di, draftDays().length);
  const pref = { morning: 600, afternoon: 840, evening: 1140, any: 630 }[c.bestTime];
  const starts = [];
  for (let s = Math.ceil(w.s / 30) * 30; s + c.minutes <= w.e; s += 30) starts.push(s);
  starts.sort((a, b) => Math.abs(a - pref) - Math.abs(b - pref));
  const s = starts.find(x => !issuesAt(c, di, x, 30).length);
  return s == null ? null : s;
}
function suggestPlan(all) {
  const d = DRAFT, days = draftDays();
  if (all) d.place = {};
  const cap = ANCHORS_PER_DAY[d.prefs.pace] || 3;
  const items = d.wish.map(candById).filter(c => c && !d.place[c.id]);
  const options = new Map(items.map(c => [c.id, days.filter((_, di) => findSlot(c, di) != null).length]));
  items.sort((a, b) => options.get(a.id) - options.get(b.id));
  let placed = 0;
  items.forEach(c => {
    let best = null;
    days.forEach((_, di) => {
      const mine = Object.keys(d.place).filter(id => d.place[id].day === di).map(candById).filter(Boolean);
      if (mine.length >= cap) return;
      const slot = findSlot(c, di); if (slot == null) return;
      const near = mine.filter(hasLL);
      const score = mine.length * 5 + (near.length && hasLL(c) ? Math.min(...near.map(o => km(o, c))) : mine.length ? 2 : 0);
      if (!best || score < best.score) best = { di, slot, score };
    });
    if (best) { d.place[c.id] = { day: best.di, start: toHM(best.slot) }; placed++; }
  });
  saveDraft();
  return { placed, left: items.length - placed };
}

function fillTrip() {
  const d = DRAFT, days = draftDays();
  const anchors = Object.keys(d.place).map(id => ({ c: candById(id), pl: d.place[id] })).filter(x => x.c && x.pl.day < days.length)
    .sort((a, b) => a.pl.day - b.pl.day || toMin(a.pl.start) - toMin(b.pl.start))
    .map(({ c, pl }) => ({ date: days[pl.day], start: pl.start, end: toHM(toMin(pl.start) + c.minutes), name: c.name, neighborhood: c.neighborhood, address: c.address }));
  if (!anchors.length) { toast("Place at least one pick on a day first."); return; }
  if (!sampleFn) { toast(noClaudeCopy("Filling in your days")); return; }
  const spare = d.wish.map(candById).filter(c => c && !(d.place[c.id] && d.place[c.id].day < days.length)).map(c => c.name + (c.neighborhood ? " (" + c.neighborhood + ")" : ""));
  generate(Object.assign({}, d.prefs, { anchors, spare, tripId: d.tripId || null }));
}

/* ---------- Planning views ---------- */
function stepsHTML(n) {
  const steps = [["plan", "Trip"], ["wish", "Wish list"], ["anchors", "Anchor days"], ["", "Itinerary"]];
  return '<ol class="steps">' + steps.map(([h, l], i) => {
    const st = i + 1 < n ? "done" : i + 1 === n ? "cur" : "";
    const inner = '<span class="n">' + (i + 1) + "</span>" + l;
    return '<li class="' + st + '"' + (st === "cur" ? ' aria-current="step"' : "") + ">" + (st === "done" && h && DRAFT ? '<a href="#' + h + '">' + inner + "</a>" : inner) + "</li>";
  }).join("") + "</ol>";
}
function draftBanner() {
  if (!DRAFT || !DRAFT.cands.length) return "";
  const placed = Object.keys(DRAFT.place).length;
  return '<div class="banner prof-banner"><span><strong>You\'re planning ' + esc(DRAFT.prefs.dest) + ".</strong> " + DRAFT.wish.length + " on your wish list" + (placed ? ", " + placed + " placed on days" : "") + '.</span><span class="row2"><button class="lnk" type="button" data-draft-reset>Start fresh</button><a class="btn small primary" href="#' + (placed ? "anchors" : "wish") + '">Continue</a></span></div>';
}
// Plain-grid map shared by the planning steps (basemap tiles aren't allowed in the page).
function planMap(label, points, paths, home, legend) {
  const ll = points.filter(hasLL), all = ll.concat(hasLL(home) ? [home] : []);
  if (all.length < 2) return '<section class="panel map"><h3>' + esc(label) + '</h3><p class="note">Pins show up here once there are places to plot.</p></section>';
  const W = 600, H = 460, P = 36;
  const { X, Y } = projection(all, W, H, P);
  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(label) + '">';
  for (let gx = 0; gx <= W; gx += 40) svg += '<line class="gridl" x1="' + gx + '" y1="0" x2="' + gx + '" y2="' + H + '"/>';
  for (let gy = 0; gy <= H; gy += 40) svg += '<line class="gridl" x1="0" y1="' + gy + '" x2="' + W + '" y2="' + gy + '"/>';
  paths.forEach(pa => {
    const ps = pa.pts.filter(hasLL);
    if (ps.length > 1) svg += '<polyline fill="none" stroke="' + pa.color + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity=".75" points="' + ps.map(p => X(p.lng).toFixed(1) + "," + Y(p.lat).toFixed(1)).join(" ") + '"/>';
  });
  ll.slice().sort((a, b) => (a.filled ? 1 : 0) - (b.filled ? 1 : 0)).forEach(pt => {
    const x = X(pt.lng).toFixed(1), y = Y(pt.lat).toFixed(1);
    svg += '<g class="pin" data-pin="' + pt.id + '"><title>' + esc(pt.title) + '</title><circle cx="' + x + '" cy="' + y + '" r="' + (pt.filled ? 18 : 9) + '" fill="' + (pt.filled ? pt.color : "var(--card)") + '" stroke="' + pt.color + '" stroke-width="3"/>' +
      (pt.label ? '<text x="' + x + '" y="' + (+y + 7).toFixed(1) + '" text-anchor="middle" style="fill:var(--on-c);font-weight:700;font-size:20px">' + esc(pt.label) + "</text>" : "") + "</g>";
  });
  if (hasLL(home)) {
    const x = X(home.lng), y = Y(home.lat);
    svg += "<g><title>" + esc(home.name) + '</title><rect x="' + (x - 9) + '" y="' + (y - 9) + '" width="18" height="18" rx="3" fill="var(--ink)"/><text x="' + (x + 14) + '" y="' + (y + 4) + '" style="fill:var(--ink);font-weight:600">' + esc(home.name) + "</text></g>";
  }
  return '<section class="panel map"><h3>' + esc(label) + "</h3>" + svg + "</svg>" + (legend ? '<div class="map-legend">' + legend + "</div>" : "") + "</section>";
}

function tileHTML(c) {

  return '<div class="tile' + (photo ? " photo" : "") + '" aria-hidden="true"' + photo + '><span class="tile-cat">' + esc(c.category) + '</span><span class="tile-name">' + esc(c.name) + '</span><span class="tile-line"><i></i><i></i><i></i></span><span class="tile-hood">' + esc(c.neighborhood || " ") + "</span></div>";
}
