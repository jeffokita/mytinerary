<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mytinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a trip drawn as a transit map. Each day is a colored line; stops sit on it in order,
   with travel legs between them. Main column = the day's line; side rail = map, home base, bookings, budget. */
:root {
  --paper: #F2F3EE;
  --card: #FFFFFF;
  --ink: #111722;
  --muted: #586170;
  --rule: #D8DBD2;
  --accent: #E0442B;
  --tint: #FBEDE9;
  --good: #2F8F4E;
  --warn: #B7791F;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --on-c: #FFFFFF;
  --l1: #E0442B; --l2: #0E8C8C; --l3: #C98A12; --l4: #5B4BC4; --l5: #2F8F4E; --l6: #C2417E; --l7: #2C6DB5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141B; --card: #161D27; --ink: #ECEEE8; --muted: #9AA3AF; --rule: #273141;
    --accent: #FF6A4D; --tint: #2A1C1A; --good: #5CC283; --warn: #E3A843;
    --l1: #FF6A4D; --l2: #2FB5B5; --l3: #E3A843; --l4: #8C7FF0; --l5: #5CC283; --l6: #E874A8; --l7: #5C9BE6;
    --on-c: #0F141B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141B; --card: #161D27; --ink: #ECEEE8; --muted: #9AA3AF; --rule: #273141;
  --accent: #FF6A4D; --tint: #2A1C1A; --good: #5CC283; --warn: #E3A843;
  --l1: #FF6A4D; --l2: #2FB5B5; --l3: #E3A843; --l4: #8C7FF0; --l5: #5CC283; --l6: #E874A8; --l7: #5C9BE6;
  --on-c: #0F141B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
@media (max-width: 480px) { .wrap { padding: 0 16px; } }

/* Top bar */
.top { border-bottom: 1px solid var(--rule); background: var(--paper); position: sticky; top: 0; z-index: 20; }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.mark { font-family: var(--display); font-weight: 700; font-size: 23px; letter-spacing: -0.01em; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.mark .dot { width: 14px; height: 14px; border-radius: 50%; border: 4px solid var(--accent); background: var(--card); }
.tagline { color: var(--muted); font-size: 14px; }
.top .spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--card); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; line-height: 1.2; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.menu { position: relative; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--rule); border-radius: 12px; min-width: 260px; padding: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.12); display: none; z-index: 30; }
.menu-pop.open { display: block; }
.menu-pop button { display: flex; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; flex-direction: column; }
.menu-pop button:hover { background: var(--paper); }
.menu-pop small { color: var(--muted); }
.menu-pop .empty { padding: 10px; color: var(--muted); font-size: 14px; }

/* Banner */
.banner { margin: 18px 0 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border: 1px dashed var(--rule); border-radius: 12px; font-size: 14px; color: var(--muted); }
.banner strong { color: var(--ink); }

/* Trip header */
.trip-head { padding: 28px 0 22px; border-bottom: 2px solid var(--ink); display: grid; gap: 14px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dest { font-family: var(--display); font-weight: 700; font-size: clamp(40px, 8vw, 104px); line-height: 1; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.thesis { font-size: 19px; max-width: 62ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--mono); font-size: 12px; padding: 4px 9px; border: 1px solid var(--rule); border-radius: 999px; background: var(--card); white-space: nowrap; }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Day line legend */
.lines { display: flex; gap: 10px; overflow-x: auto; padding: 18px 0 6px; scrollbar-width: thin; }
.line-tab { flex: 0 0 auto; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 14px 10px 10px; cursor: pointer; min-width: 190px; max-width: 260px; }
.line-tab .bullet { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: var(--on-c); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 16px; }
.line-tab .d { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.line-tab .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.line-tab[aria-selected="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }

/* Main grid */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; padding: 18px 0 60px; align-items: start; }
@media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
.rail { display: grid; gap: 18px; position: sticky; top: 76px; }
@media (max-width: 980px) { .rail { position: static; } }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 16px; }
.panel h3 { font-family: var(--body); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h3 small { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--muted); text-transform: none; letter-spacing: 0; }

/* Day header */
.day-head { display: grid; gap: 8px; margin-bottom: 18px; }
.day-head h2 { font-family: var(--display); font-weight: 600; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.15; letter-spacing: -0.01em; }
.day-head .pitch { font-size: 17px; color: var(--muted); max-width: 64ch; }
.day-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rework { display: flex; gap: 8px; flex: 1 1 320px; }
.rework input { flex: 1; min-width: 0; border: 1px solid var(--rule); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 14px; }

/* Timeline */
.timeline { position: relative; display: grid; gap: 0; }
.stop { display: grid; grid-template-columns: 88px 40px minmax(0, 1fr); align-items: start; }
.stop .time { font-family: var(--mono); font-size: 13px; padding-top: 18px; text-align: right; padding-right: 8px; font-variant-numeric: tabular-nums; }
.stop .time small { display: block; white-space: nowrap; color: var(--muted); font-size: 11px; }
.rail-col { position: relative; align-self: stretch; display: flex; justify-content: center; }
.rail-col::before { content: ""; position: absolute; top: 0; bottom: 0; width: 6px; background: var(--c); left: 50%; transform: translateX(-50%); }
.stop:first-child .rail-col::before { top: 22px; }
.stop:last-child .rail-col::before { bottom: calc(100% - 22px); }
.node { position: relative; z-index: 1; margin-top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--card); border: 4px solid var(--c); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 600; }
.node.minor { width: 16px; height: 16px; margin-top: 17px; border-width: 3px; }
.node.home { border-radius: 4px; }
.card { margin: 6px 0; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; transition: border-color .15s, box-shadow .15s; }
.card.hl { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.card.free { background: transparent; border-style: dashed; }
.card.transitk { background: transparent; border: 0; padding: 10px 2px; }
.card .cat { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.card .name { font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1.2; }
.card .why { font-size: 15px; }
.tip { font-size: 14px; background: var(--tint); border-left: 3px solid var(--accent); padding: 7px 10px; border-radius: 0 8px 8px 0; }
.tip b { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; }
.card .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
.pill { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--rule); white-space: nowrap; }
.pill.now { background: var(--accent); color: #fff; border-color: var(--accent); }
.pill.daybefore { border-color: var(--warn); color: var(--warn); }
.pill.walkin { color: var(--muted); }
.lnk { font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; padding: 2px 4px; cursor: pointer; }
.lnk:hover { color: var(--ink); }
.leg { display: grid; grid-template-columns: 88px 40px minmax(0,1fr); }
.leg .rail-col::before { background: repeating-linear-gradient(var(--c) 0 6px, transparent 6px 11px); width: 4px; }
.leg .txt { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 6px 0; }

/* Map */
.map svg { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--paper); }
.map .gridl { stroke: var(--rule); stroke-width: 1; }
.map text { font-family: var(--mono); fill: var(--muted); font-size: 11px; }
.map .stop-c { cursor: pointer; }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.map-legend i { width: 14px; height: 4px; border-radius: 2px; background: var(--c); display: inline-block; }

/* Home base */
.home-name { font-family: var(--display); font-weight: 600; font-size: 18px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.routine { display: grid; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rule); }
.routine div { display: grid; grid-template-columns: 92px 1fr; gap: 8px; font-size: 14px; }
.routine b { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 400; padding-top: 2px; }
.alts { margin-top: 10px; font-size: 14px; }
.alts summary { cursor: pointer; color: var(--muted); }
.alts ul { margin: 8px 0 0; padding-left: 18px; }

/* Bookings */
.bk-group { display: grid; gap: 4px; margin-bottom: 12px; }
.bk-group:last-child { margin-bottom: 0; }
.bk-label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.bk-label .sw { width: 8px; height: 8px; border-radius: 50%; }
.bk { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: start; font-size: 14px; padding: 4px 0; }
.bk input { margin-top: 3px; accent-color: var(--accent); }
.bk.done span { text-decoration: line-through; color: var(--muted); }
.bk em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; padding-top: 2px; }

/* Budget */
.bud-row { display: grid; grid-template-columns: 44px 1fr 64px; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 8px; }
.bud-row .lab { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.bud-row .amt { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 14px; background: var(--paper); border-radius: 4px; display: flex; overflow: visible; }
.bar span { height: 100%; }
.bar span:first-child { border-radius: 4px 0 0 4px; }
.bar .target { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.bud-key { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.bud-key span { display: inline-flex; align-items: center; gap: 5px; }
.bud-key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.bud-sum { font-size: 14px; margin-bottom: 12px; }
.bud-sum strong { font-family: var(--display); font-size: 26px; font-weight: 700; display: block; line-height: 1.1; }

.watch { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 6px; }

/* Plan form */
.plan { max-width: 860px; padding: 32px 0 80px; }
.plan h1 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 6vw, 72px); line-height: 1; letter-spacing: -0.02em; }
.plan .lede, .prof .lede { font-size: 18px; color: var(--muted); max-width: 58ch; margin: 14px 0 26px; }
fieldset { border: 0; border-top: 2px solid var(--ink); margin: 0 0 26px; padding: 16px 0 0; display: grid; gap: 16px; }
legend { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; padding: 0 10px 0 0; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
label.f { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
label.f span.h { font-weight: 400; color: var(--muted); font-size: 13px; }
.inp { border: 1px solid var(--rule); background: var(--card); border-radius: 10px; padding: 10px 12px; width: 100%; font-weight: 400; font-size: 16px; }
textarea.inp { min-height: 88px; resize: vertical; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-block; padding: 8px 14px; border: 1px solid var(--rule); border-radius: 999px; background: var(--card); font-size: 14px; font-weight: 500; }
.seg input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.sliders { display: grid; gap: 12px; }
.sl { display: grid; grid-template-columns: 170px 1fr 28px; gap: 12px; align-items: center; font-size: 15px; }
.sl input { accent-color: var(--accent); width: 100%; }
.sl output { font-family: var(--mono); text-align: right; }
@media (max-width: 480px) { .sl { grid-template-columns: 1fr 28px; } .sl input { grid-column: 1 / -1; grid-row: 2; } }
.qlabel { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.form-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.form-actions .btn.primary { padding: 12px 22px; font-size: 16px; }
.note { font-size: 13px; color: var(--muted); }
.err { color: var(--accent); font-size: 14px; font-weight: 600; }

/* Generating */
.gen { padding: 60px 0 100px; max-width: 760px; }
.gen .dest { font-size: clamp(40px, 7vw, 88px); }
.gen-line { margin: 34px 0 18px; height: 8px; border-radius: 4px; background: var(--rule); position: relative; overflow: hidden; }
.gen-line i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; transition: width .6s ease; }
.gen-stops { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
.gen-stops .chip { animation: pop .3s ease both; }
@keyframes pop { from { transform: scale(.8); opacity: .2; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .gen-stops .chip { animation: none; } .gen-line i { transition: none; } }
.gen-status { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 14px; }

/* Drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(10,14,20,.35); z-index: 40; display: none; }
.drawer-bg.open { display: block; }
.drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(460px, 100%); background: var(--paper); border-left: 1px solid var(--rule); z-index: 41; transform: translateX(105%); transition: transform .2s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer header { padding: 18px 18px 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 4px; }
.drawer header h3 { font-family: var(--display); font-weight: 600; font-size: 22px; }
.drawer .body { padding: 16px 18px; overflow-y: auto; display: grid; gap: 10px; align-content: start; flex: 1; }
.drawer .x { position: absolute; right: 14px; top: 14px; }
.alt { text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px; cursor: pointer; display: grid; gap: 4px; }
.alt:hover { border-color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 60; display: none; max-width: calc(100% - 32px); }
.toast.show { display: block; }
/* Import from Gmail / Calendar */
.import { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 18px; display: grid; gap: 12px; margin: 0 0 28px; }
.import h2 { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.15; }
.import .row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.found-strip { margin: 18px 0 0; }
.found-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.found { border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; background: var(--paper); align-content: start; }
.found .fd { font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1.1; }
.found ul { margin: 0; padding-left: 16px; font-size: 13px; color: var(--muted); }
.found .btn { justify-self: start; margin-top: 4px; }
.scan-notes { font-size: 13px; color: var(--warn); margin: 0; padding-left: 18px; }
.pill.booked { background: var(--good); border-color: var(--good); color: #fff; }
.booked-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.booked-list li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.hidden { display: none !important; }
.who { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
@media (max-width: 760px) { .who .em { display: none; } }
.login { padding: 64px 0 100px; max-width: 680px; }
.login .look { margin-top: 24px; max-width: 520px; }
.login .lede { font-size: 18px; color: var(--muted); margin: 12px 0 0; }
.tile.photo { color: #fff; background-size: cover; background-position: center; background-color: var(--c); }
.tile.photo::after { display: none; }
.tile.photo .tile-line i { background: rgba(0,0,0,.35); }
.unverified { font-size: 12px; font-weight: 600; color: var(--warn); }
.wbody .foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.demo-bar { background: var(--ink); color: var(--paper); font-size: 13px; }
.demo-bar .wrap { padding-top: 7px; padding-bottom: 7px; }
.demo-bar strong { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; background: var(--accent); color: #fff; padding: 2px 7px; border-radius: 999px; margin-right: 8px; }

/* Planning flow: steps, wish list, anchor board */
.planflow { padding: 28px 0 120px; }
.pf-title { font-family: var(--display); font-weight: 700; font-size: clamp(32px, 5vw, 56px); line-height: 1.05; letter-spacing: -0.02em; }
.planflow .lede { font-size: 17px; color: var(--muted); max-width: 64ch; margin: 10px 0 0; }
.planflow .grid.wide { grid-template-columns: minmax(0, 1fr) 360px; }
@media (max-width: 980px) { .planflow .grid.wide { grid-template-columns: 1fr; } }
.steps { display: flex; flex-wrap: wrap; gap: 6px 22px; list-style: none; padding: 0; margin: 0 0 18px; font-size: 14px; color: var(--muted); }
.steps li, .steps a { display: flex; align-items: center; gap: 8px; text-decoration: none; }
.steps .n { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--rule); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; }
.steps li.cur { color: var(--ink); font-weight: 600; }
.steps li.cur .n { border-color: var(--accent); background: var(--accent); color: #fff; }
.steps li.done .n { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.steps a:hover { color: var(--ink); }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.filters button { border: 1px solid var(--rule); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.wish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.wcard { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s, box-shadow .15s; }
.wcard.hl { border-color: var(--c); }
.wcard.on { border-color: var(--c); box-shadow: 0 0 0 2px var(--c); }
.flash { animation: flash 1.1s ease; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 4px var(--accent); } }
.tile { background: var(--c); color: var(--on-c); padding: 14px 16px 12px; min-height: 150px; display: grid; grid-template-rows: auto 1fr auto auto; gap: 6px; position: relative; overflow: hidden; }
.tile::after { content: ""; position: absolute; right: -46px; top: -46px; width: 150px; height: 150px; border-radius: 50%; border: 20px solid currentColor; opacity: .13; }
.tile-cat, .tile-hood { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; opacity: .9; position: relative; }
.tile-cat { text-transform: uppercase; }
.tile-name { font-family: var(--display); font-weight: 700; font-size: 23px; line-height: 1.08; align-self: end; position: relative; text-wrap: balance; }
.tile-line { display: flex; justify-content: space-between; align-items: center; height: 12px; position: relative; margin-top: 4px; }
.tile-line::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 4px; background: currentColor; opacity: .5; border-radius: 2px; }
.tile-line i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 3px solid currentColor; position: relative; }
.wbody { padding: 12px 14px 14px; display: grid; gap: 8px; flex: 1; align-content: start; }
.fitwhy { font-size: 13px; font-weight: 600; color: var(--accent); }
.wbody .why { font-size: 14px; margin: 0; }
.wmeta { display: grid; gap: 2px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.wbody .foot { margin-top: auto; padding-top: 2px; }
.wish-more { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
.look { display: flex; gap: 8px; flex: 1 1 340px; }
.look input { flex: 1; min-width: 0; border: 1px solid var(--rule); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.wish-load { padding: 10px 0 40px; }
.nextbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--rule); z-index: 25; box-shadow: 0 -6px 20px rgba(0,0,0,.06); }
.nextbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.pin { cursor: pointer; }
.pin.hl circle { stroke: var(--ink); stroke-width: 5; }
.tray { margin-bottom: 16px; display: grid; gap: 10px; }
.tray h3 { margin-bottom: 0; }
.tray.over { border-color: var(--accent); box-shadow: 0 0 0 3px var(--tint); }
.tray-items { display: flex; flex-wrap: wrap; gap: 8px; }
.tray-items:empty { display: none; }
.tray-item { border: 1px solid var(--rule); border-left: 5px solid var(--c); border-radius: 10px; padding: 7px 10px; background: var(--paper); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; display: grid; max-width: 260px; }
.tray-item b { font-size: 14px; font-weight: 600; line-height: 1.25; }
.tray-item small { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.tray-item.hl { border-color: var(--c); }
.board-scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 16px; background: var(--card); }
.board { display: grid; min-width: min-content; }
.gutter-l { position: relative; }
.gutter-l span { position: absolute; right: 6px; transform: translateY(-50%); font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
.gutter-l span:first-child { transform: none; }
.day-h { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--rule); }
.day-h b { display: block; font-size: 14px; line-height: 1.2; }
.day-h small { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.bullet { width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: var(--on-c); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 14px; flex: none; }
.day-col { border-left: 1px solid var(--rule); }
.day-body { position: relative; background-image: repeating-linear-gradient(to bottom, var(--rule) 0, var(--rule) 1px, transparent 1px, transparent var(--pxh)); }
.offhours { position: absolute; left: 0; right: 0; background: var(--paper); opacity: .7; }
.blocked { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--paper) 0 6px, var(--card) 6px 12px); display: flex; align-items: flex-end; font-family: var(--mono); font-size: 10px; color: var(--muted); padding: 4px 6px; line-height: 1.3; }
.blocked.top { align-items: flex-start; }
.anc { position: absolute; left: 5px; right: 5px; background: var(--card); border: 1px solid var(--c); border-left: 5px solid var(--c); border-radius: 8px; padding: 4px 20px 4px 8px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; display: grid; align-content: start; gap: 1px; box-shadow: 0 1px 3px rgba(0,0,0,.08); z-index: 2; }
.anc b { font-size: 13px; line-height: 1.2; font-weight: 600; }
.anc .t { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.anc .w { font-size: 11px; color: var(--warn); font-weight: 600; line-height: 1.25; }
.anc.warn { border-color: var(--warn); border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--card)); }
.anc.hl { box-shadow: 0 0 0 2px var(--c); }
.anc.lifted, .tray-item.lifted { opacity: .35; }
.anc-x { position: absolute; right: 1px; top: 1px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: 999px; }
.anc-x:hover { color: var(--accent); }
.band { position: absolute; left: 0; right: 0; background: color-mix(in srgb, var(--good) 16%, transparent); border-top: 1px dashed var(--good); border-bottom: 1px dashed var(--good); pointer-events: none; z-index: 1; }
.closed-note { position: absolute; inset: 0; display: grid; place-items: start center; padding-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--warn); background: color-mix(in srgb, var(--warn) 9%, transparent); pointer-events: none; text-transform: uppercase; letter-spacing: .06em; z-index: 3; }
.drop-ghost { position: absolute; left: 5px; right: 5px; border: 2px dashed var(--c); border-radius: 8px; background: color-mix(in srgb, var(--c) 12%, transparent); font-family: var(--mono); font-size: 11px; padding: 4px 8px; pointer-events: none; z-index: 3; line-height: 1.3; }
.drop-ghost.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); font-weight: 600; }
.drag-float { position: fixed; z-index: 70; pointer-events: none; width: 170px; background: var(--card); border: 1px solid var(--c); border-left: 5px solid var(--c); border-radius: 8px; padding: 6px 8px; font-size: 13px; font-weight: 600; box-shadow: 0 12px 28px rgba(0,0,0,.22); transform: rotate(-1.5deg); overflow: hidden; }
.board-foot { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
.board-foot .btn.primary { padding: 12px 22px; font-size: 16px; }
.board-foot .note { flex: 1 1 300px; }
.warn-t { color: var(--warn); }
.day-sum { display: grid; gap: 12px; }
.day-sum > div { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 14px; align-items: start; }
.day-sum .far { color: var(--warn); font-weight: 600; }
.place-form { display: grid; gap: 12px; }
.pill.pick { border-color: var(--c); color: var(--c); font-weight: 600; }

/* Text boxes: a calm dark focus ring instead of the red outline (red reads as an error) */
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; }
.inp:focus, .look input:focus, .rework input:focus, .chat-input textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 12%, transparent); }

/* Landing (signed out) */
body.signed-out #profileBtn, body.signed-out .menu, body.signed-out #planBtn { display: none; }
.beta-note { background: var(--tint); border-bottom: 1px solid var(--rule); font-size: 14px; }
.beta-note .wrap { display: flex; gap: 12px; align-items: baseline; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.beta-note strong { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; background: var(--accent); color: #fff; padding: 3px 9px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 56px; align-items: center; padding-top: 56px; padding-bottom: 44px; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; padding-top: 32px; gap: 32px; } }
.hero .pf-title { font-size: clamp(40px, 6vw, 76px); }
.hero .lede { font-size: 19px; color: var(--muted); margin: 14px 0 0; max-width: 52ch; }
.hero .look { margin: 26px 0 8px; max-width: 580px; }
.hero .look input { padding: 11px 16px; font-size: 16px; }
.art-card { background: var(--card); border: 1px solid var(--rule); border-radius: 18px; padding: 22px 22px 6px; box-shadow: 0 18px 40px rgba(0,0,0,.08); display: grid; gap: 6px; transform: rotate(1deg); --c: var(--l1); }
.art-title { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.15; }
.art-day { list-style: none; margin: 14px 0 0; padding: 0; display: grid; }
.art-day li { display: grid; grid-template-columns: 74px 30px 1fr; position: relative; padding-bottom: 20px; }
.art-day li::before { content: ""; position: absolute; left: 84px; top: 14px; bottom: -6px; width: 6px; background: var(--l1); }
.art-day li:last-child::before { display: none; }
.art-t { font-family: var(--mono); font-size: 12px; padding-top: 3px; }
.art-dot { width: 22px; height: 22px; border-radius: 50%; border: 5px solid var(--l1); background: var(--card); position: relative; z-index: 1; margin-left: 2px; }
.art-day b { display: block; font-family: var(--display); font-weight: 600; font-size: 18px; line-height: 1.2; }
.art-day small { display: block; color: var(--muted); font-size: 13px; }
.art-day .pill { margin-top: 6px; display: inline-block; }
.props { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; padding-bottom: 80px; }
.prop { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 18px; display: grid; gap: 8px; align-content: start; }
.prop h2 { font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.15; }
.prop p { margin: 0; font-size: 15px; color: var(--muted); }

/* Home / pick a starting point */
.start { padding: 32px 0 80px; }
.start .lede { font-size: 17px; color: var(--muted); margin: 10px 0 24px; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.choice { background: var(--card); border: 1px solid var(--rule); border-top: 6px solid var(--c); border-radius: 18px; padding: 22px; display: grid; gap: 12px; align-content: start; }
.choice h2 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.1; }
.choice p { margin: 0; color: var(--muted); font-size: 16px; max-width: 46ch; }
.choice-line { display: flex; justify-content: space-between; align-items: center; height: 14px; position: relative; max-width: 150px; }
.choice-line::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 4px; background: var(--c); border-radius: 2px; }
.choice-line i { width: 14px; height: 14px; border-radius: 50%; border: 4px solid var(--c); background: var(--card); position: relative; }
.your-trips { margin-top: 40px; }
.sec-h { font-family: var(--display); font-weight: 600; font-size: 24px; margin-bottom: 12px; }
.trip-card { text-align: left; cursor: pointer; font: inherit; color: inherit; }
.trip-card:hover { border-color: var(--ink); }

/* Inspiration */
.disc-filters { display: flex; gap: 18px 28px; flex-wrap: wrap; align-items: flex-end; margin: 22px 0 22px; }
.disc-filters .filters { margin-bottom: 0; }
.ideas { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.idea { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.idea .tile { min-height: 200px; }
.idea .tile-name { font-size: 30px; }
.sample summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.sample ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.sample li { display: grid; grid-template-columns: 70px 1fr; gap: 8px; }
.sample li b { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); padding-top: 3px; }

/* Travel card */
.prof-side { display: grid; gap: 18px; position: sticky; top: 76px; align-content: start; }
@media (max-width: 900px) { .prof-side { position: static; } }
.prof-side .prof-panel { position: static; }
.prof-card { width: 100%; height: auto; display: block; border-radius: 12px; aspect-ratio: 1080 / 1350; background: #111722; }

/* Plan form extras */
.prefill-note { background: color-mix(in srgb, var(--l2) 10%, var(--card)); border: 1px solid var(--l2); color: var(--ink); justify-content: space-between; margin: 0 0 22px; }
.pre-tag { display: inline-block; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--l2); border: 1px solid var(--l2); border-radius: 999px; padding: 1px 7px; margin-left: 6px; font-weight: 600; vertical-align: 1px; }
label.f .pre-tag { justify-self: start; margin-left: 0; }
label.f.pre .inp { border-color: var(--l2); background: color-mix(in srgb, var(--l2) 5%, var(--card)); }
.diet-lvl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 14px; }
.diet-lvl > span { min-width: 110px; font-weight: 600; }
.seg.small span { padding: 5px 11px; font-size: 13px; }

/* Wish list: waiting screen */
.wait { display: grid; gap: 24px; }
.wait-head { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 18px; }
.wait-steps { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; font-size: 15px; }
.wait-steps li { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.wait-steps .st { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--rule); flex: none; }
.wait-steps li.done { color: var(--ink); }
.wait-steps li.done .st { background: var(--good); border-color: var(--good); }
.wait-steps li.now { color: var(--ink); font-weight: 600; }
.wait-steps li.now .st { border-color: var(--accent); border-top-color: transparent; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.wait .gen-line { margin: 0 0 12px; }
.wait-qs { display: grid; gap: 14px; }
.wait-q .filters { margin: 0; }
.skel > div, .skel-rows > div { border-radius: 16px; background: linear-gradient(90deg, var(--card) 0%, var(--paper) 50%, var(--card) 100%); background-size: 200% 100%; border: 1px solid var(--rule); animation: shimmer 1.4s ease infinite; }
.skel > div { height: 300px; }
.skel-rows { display: grid; gap: 12px; margin-top: 10px; }
.skel-rows > div { height: 86px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .wait-steps li.now .st, .skel > div, .skel-rows > div { animation: none; } }
.pill.only { justify-self: start; border-color: var(--accent); color: var(--accent); font-weight: 600; }

/* Anchor board: why we anchor */
.anchor-why { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; align-items: center; margin: 18px 0 4px; border-left: 4px solid var(--l2); }
@media (max-width: 760px) { .anchor-why { grid-template-columns: 1fr; } }
.anchor-why h2 { font-family: var(--display); font-weight: 600; font-size: 22px; margin-bottom: 6px; }
.anchor-why p { margin: 0 0 10px; font-size: 15px; }
.aw-points { margin: 0 0 14px; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.aw-points b { color: var(--ink); }
.aw-pics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.aw-pics figure { margin: 0; display: grid; gap: 6px; }
.aw-pics svg { width: 100%; height: auto; background: var(--paper); border-radius: 10px; }
.aw-pics figcaption { font-size: 12px; color: var(--muted); line-height: 1.3; }
.anchor-why-link { margin: 10px 0 0; }

/* Anchor board: pick reminders */
.pick-card { position: fixed; z-index: 72; width: 280px; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.18); pointer-events: none; }
.pd-photo { display: block; width: 100%; height: 130px; object-fit: cover; background: var(--paper); }
.pd-tile { background: var(--c); opacity: .85; height: 60px; }
.pd-body { padding: 10px 12px 12px; display: grid; gap: 4px; }
.pd-body b { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.2; }
.pick-detail { border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--card); }
.pick-list { display: grid; gap: 4px; max-height: 360px; overflow-y: auto; }
.pick-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; background: none; border: 0; border-left: 4px solid var(--c); border-radius: 8px; padding: 6px 8px; cursor: pointer; font: inherit; color: inherit; }
.pick-row:hover { background: var(--paper); }
.pick-row img, .pick-dot { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--paper); display: block; }
.pick-dot { background: color-mix(in srgb, var(--c) 22%, var(--card)); }
.pick-row b { display: block; font-size: 14px; font-weight: 600; line-height: 1.25; }
.pick-row small { display: block; font-size: 12px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-row .when { font-family: var(--mono); font-size: 11px; color: var(--c); }

/* Anchor board: click-to-add */
.day-body { cursor: cell; }
.slot-sel { position: absolute; left: 5px; right: 5px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 14%, transparent); border: 2px solid var(--accent); font-family: var(--mono); font-size: 11px; padding: 3px 7px; z-index: 4; pointer-events: none; }
.slot-pop { position: fixed; z-index: 75; width: 300px; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.18); display: grid; gap: 10px; }
.sp-time { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.sp-fill { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.slot-tip { margin: 0; }

/* Anchor board: placeholders and routines */
.ph-row { display: grid; gap: 6px; }
.ph-add { cursor: pointer; background: var(--card); font-family: var(--body); font-size: 13px; }
.ph-add:hover { border-color: var(--ink); }
.ph-custom { display: inline-flex; gap: 4px; }
.ph-custom input { border: 1px solid var(--rule); border-radius: 999px; padding: 3px 10px; font-size: 13px; background: var(--card); width: 150px; }
.anc.ph, .tray-item.ph { border-style: dashed; background: var(--paper); }
.blocked.routine { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--l4) 10%, var(--card)) 0 6px, var(--card) 6px 12px); color: var(--l4); z-index: 1; }

/* Itinerary */
.who-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.who-bar .filters { margin: 0; }
.pill.who { border-color: var(--l4); color: var(--l4); }
.day-pending { padding: 10px 0 30px; }
.share-cta { justify-content: space-between; background: var(--card); border-style: solid; }
.share-cta .look { flex: 1 1 320px; max-width: 460px; }

/* Weather */
.wx { display: inline-flex; gap: 4px; align-items: center; font-family: var(--mono); font-size: 12px; white-space: nowrap; color: var(--ink); }
.wx.typ { color: var(--muted); }
.day-wx { margin-top: -2px; }
.day-h > span:last-child { min-width: 0; }
.day-h .wx { display: block; font-size: 10px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wx-days { display: grid; gap: 6px; }
.wx-day { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 4px 6px; border-radius: 8px; }
.wx-day.on { background: var(--paper); }
.wx-line { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 12px 0 0; }

// Same shape as the claude.ai sampling function: fn(prompt) -> {text}, fn.json(prompt, {onText, signal, modelTier}) -> parsed JSON.
function hostedSample() {
  async function text(prompt, opts) {
    opts = opts || {};
    let r;
    try {
      r = await fetch("/api/claude", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ prompt, tier: opts.modelTier === "quick" ? "quick" : "default" }), signal: opts.signal });
    } catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network" }; }
    if (r.status === 401) { ME = null; render(); throw { code: "signed_out" }; }
    if (r.status === 429) throw { code: "rate_limited" };
    if (!r.ok || !r.body) throw { code: "api_error" };
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "", out = "", stop = "";

      let chunk;
      try { chunk = await reader.read(); } catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network" }; }
      if (chunk.done) break;
      buf += dec.decode(chunk.value, { stream: true });

      while ((i = buf.indexOf("\n")) >= 0) {
        const ln = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!ln.trim()) continue;
        const o = JSON.parse(ln);
        if (o.t) { out += o.t; if (opts.onText) opts.onText({ text: out, delta: o.t }); }
        else if (o.error) throw o.error;
        else if (o.done) stop = o.stop;

    }
    if (stop === "refusal") throw { code: "refused" };
    return { text: out, truncated: stop === "max_tokens" };

    try { return JSON.parse(s); } catch (e) { /* try the tolerant forms below */ }
    const a = Math.min(...["{", "["].map(ch => { const k = s.indexOf(ch); return k < 0 ? Infinity : k; }));
    const z = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]"));
    if (a < z) { try { return JSON.parse(s.slice(a, z + 1)); } catch (e) { /* fall through */ } }
    throw { code: "invalid_json" };
  }

  fn.json = async (prompt, opts) => parseJSON((await text(prompt, opts)).text);

}
async function placesMatch(dest, items) {
  if (!PLACES || !items.length) return null;
  try {
    const r = await fetch("/api/places/match", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ dest, items: items.map(i => ({ name: i.name, address: i.address || "", neighborhood: i.neighborhood || "", lat: hasLL(i) ? i.lat : null, lng: hasLL(i) ? i.lng : null })) }) });
    return r.ok ? (await r.json()).results : null;
  } catch (e) { return null; }
}
// Google's answer replaces Claude's guesses for location, hours and address.
function applyPlace(o, g) {
  if (!g) { o.verified = false; return o; }
  Object.assign(o, { verified: true, placeId: g.id, address: g.address || o.address, lat: g.lat, lng: g.lng, rating: g.rating, ratingCount: g.ratingCount, photo: g.photo, mapsUrl: g.mapsUrl, gStatus: g.status });
  if (g.hours) { o.hours = g.hours; o.hoursFrom = "google"; }
  // Restaurants: Google's price range (or price level) replaces Claude's guess at what a meal costs.
  const meal = o.kind === "meal" || o.category === "Food & drink" || MEALS.includes(String(o.category || "").toLowerCase());
  const lv = { PRICE_LEVEL_INEXPENSIVE: [15, "$"], PRICE_LEVEL_MODERATE: [30, "$$"], PRICE_LEVEL_EXPENSIVE: [60, "$$$"], PRICE_LEVEL_VERY_EXPENSIVE: [110, "$$$$"] }[g.priceLevel];
  if (lv) o.costTier = lv[1];
  if (meal && g.priceRange && g.priceRange.lo) {
    o.priceRange = g.priceRange; o.cost = Math.round((g.priceRange.lo + (g.priceRange.hi || g.priceRange.lo)) / 2); o.priceFrom = "google";
  } else if (meal && lv) { o.cost = /coffee|breakfast/i.test(o.category || "") ? Math.round(lv[0] * 0.6) : lv[0]; o.priceFrom = "google"; }

}
// Swap specific stops for real, open places of the same kind in the same slot (closed on Google, or repeated on another day).
async function replaceItems(t, bad, why) {
  if (!bad.length || !sampleFn) return 0;
  const prompt = "You fix a Mytinerary itinerary. " + why + " Replace each one with a different real, currently open place of the same kind, near the stops before and after it, in the same time slot, and not used anywhere else in the trip.\n\nTRIP\n" + tripContext(t) +
    "\n\nPLACES ALREADY IN THE TRIP (don't use these)\n" + t.days.map(d => d.items.map(i => i.name).join(", ")).join("\n") + "\n\n" +
    bad.map((x, k) => k + ". Day " + (x.di + 1) + " (" + t.days[x.di].date + ") " + x.it.time + "-" + (x.it.end || "") + " " + (x.it.category || x.it.kind) + ": " + x.it.name + "\nThat day's plan:\n" + dayList(t.days[x.di])).join("\n\n") +
    "\n\nReply with ONLY a JSON array with one replacement per numbered item, in order, each shaped like:\n" + ITEM_SHAPE;
  const arr = await sampleFn.json(prompt, { modelTier: "quick", cache: false }).catch(() => null);
  if (!Array.isArray(arr)) return 0;
  const reps = bad.map((x, k) => arr[k] && arr[k].name ? Object.assign(normItem(arr[k]), { time: x.it.time, end: x.it.end, transitFromPrev: x.it.transitFromPrev, anchor: false, who: x.it.who }) : null);
  const live = reps.filter(Boolean), res = await placesMatch(t.destination, live);
  if (res) live.forEach((r, i) => applyPlace(r, res[i]));
  let n = 0;
  reps.forEach((r, i) => { if (r && !closedOnGoogle(r)) { t.days[bad[i].di].items[bad[i].ii] = r; n++; } });
  return n;
}
async function replaceClosed(t) {
  const bad = [];
  t.days.forEach((d, di) => d.items.forEach((it, ii) => { if (closedOnGoogle(it)) bad.push({ di, ii, it }); }));
  return replaceItems(t, bad, "Google Maps lists these places as closed.");
}
// Days are planned in parallel, so two days can pick the same spot. Keep the first, swap the later ones (never anchors or the hotel).
async function fixRepeats(t) {
  const seen = new Set(), bad = [];
  t.days.forEach((d, di) => d.items.forEach((it, ii) => {
    if (["transit", "lodging", "free"].includes(it.kind) || !it.name) return;
    const k = it.name.toLowerCase().replace(/^the\s+/, "").replace(/[^a-z0-9]+/g, " ").trim();
    if (seen.has(k) && !it.anchor) bad.push({ di, ii, it }); else seen.add(k);
  }));
  return replaceItems(t, bad, "These places are repeated from an earlier day of the same trip.");
}
const closedOnGoogle = o => o.gStatus === "CLOSED_PERMANENTLY" || o.gStatus === "CLOSED_TEMPORARILY";
async function enrichTrip(t) {
  const known = {};

  const todo = [];
  t.days.forEach(d => d.items.forEach(it => {
    if (["transit", "free", "lodging"].includes(it.kind)) return;
    const k = known[it.name.toLowerCase()];
    if (k) applyPlace(it, { id: k.placeId, address: k.address, lat: k.lat, lng: k.lng, rating: k.rating, ratingCount: k.ratingCount, photo: k.photo, mapsUrl: k.mapsUrl, status: k.gStatus, hours: k.hoursFrom === "google" ? k.hours : null });

/* Sync (hosted only): profile, plan in progress, form defaults and trips are saved to the server under your

const SYNC_KEYS = { "mytin.profile": "profile", "mytin.profileChat": "profileChat", "mytin.draft": "draft", "mytin.form": "form", "mytin.found": "found" };
let syncReady = false, syncTimer = null, syncSent = {}; // syncSent: doc key -> JSON last known to match the server
function localDocs() {
  const out = {};
  Object.keys(SYNC_KEYS).forEach(k => { out[SYNC_KEYS[k]] = store(k); });

}
function syncTouch() {

async function pushSync() {

    if (!r.ok) throw new Error(String(r.status));

// Same interface as the claude.ai connectors (callTool), backed by the server's Google connection.
function hostedMcp() {
  const call = async path => {
    const r = await fetch(path);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (j.code === "not_connected" || j.code === "needs_reauth") { GOOGLE_CONNECTED = false; mcpApi = null; }
      throw { code: j.code || "server_unavailable", retryable: r.status >= 500 };
    }
    return { payload: j };
  };
  return {
    callTool(server, tool, args) {
      if (tool === "list_events") return call("/api/google/events?" + new URLSearchParams({ timeMin: new Date(args.startTime).toISOString(), timeMax: new Date(args.endTime).toISOString() }));
      if (tool === "search_threads") return call("/api/google/threads?" + new URLSearchParams({ q: args.query, max: String(args.pageSize || 30) }));
      if (tool === "get_thread") return call("/api/google/thread?" + new URLSearchParams({ id: args.threadId }));
      return Promise.reject({ code: "not_in_manifest" });
    }
  };
}
function findTrip() {
  if (HOSTED && !mcpApi) { location.href = "/auth/google/start"; return; }
  if (location.hash !== "#plan") location.hash = "plan";
  scanTrips(false);
}
// Back from Google's consent screen: /?google=connected#plan
function handleGoogleReturn() {
  const g = new URLSearchParams(location.search).get("google");
  if (!g || !HOSTED || !ME) return;
  history.replaceState(null, "", location.pathname + location.hash);
  if (g === "connected" && mcpApi) { toast("Connected. Looking for your upcoming trips…"); scanTrips(false); }
  else if (g === "partial") toast("Google didn't share both Gmail and Calendar. Connect again and tick both boxes.");
  else if (g === "denied") toast("Google wasn't connected.");
  else toast("Connecting Google didn't work. Try again.");
}

function wxPrompt(w) {

    '<div class="wx-days">' + t.days.map((d, i) => w.days[d.date] ? '<div class="wx-day' + (i === S.day ? " on" : "") + '"><span class="pf-k">' + esc(fmtDay(d.date)) + "</span>" + wxChip(w.days[d.date], { label: true }) + "</div>" : "").join("") + "</div>" +

/* ---------- State ---------- */
const S = {
  view: "trip",
  trip: null,
  day: 0,
  hl: null,
  who: "all", shared: null, readOnly: false,
  gen: null,
  formError: "",
  scan: { state: "idle", step: "", trips: [], notes: [], err: "", picking: null, homeCity: "" }
};
S.disc = Object.assign({ ideas: [], len: DISC_LEN[0], reach: DISC_REACH[1] }, store("mytin.ideas") || {});
S.discLoad = null;
function savedTrips() { return store("mytin.trips") || []; }
function saveTrip(t) {
  if (!t || t.example) return;
  const list = savedTrips().filter(x => x.id !== t.id);
  list.unshift(t);
  store("mytin.trips", list.slice(0, 12));
}
function normalize(t) {
  t.id = t.id || uid();
  t.travelers = Math.max(1, parseInt(t.travelers, 10) || 1);
  t.days = Array.isArray(t.days) ? t.days : [];
  t.days.forEach(d => {
    d.items = Array.isArray(d.items) ? d.items : [];
    d.items.forEach(normItem);
  });
  t.homeBase = t.homeBase || {};
  const hb = t.homeBase;
  hb.lat = Number(hb.lat); hb.lng = Number(hb.lng); hb.nightly = Number(hb.nightly) || 0; hb.booked = !!hb.booked;
  hb.alternatives = Array.isArray(hb.alternatives) ? hb.alternatives : [];
  hb.routine = Array.isArray(hb.routine) ? hb.routine : [];
  t.watchouts = Array.isArray(t.watchouts) ? t.watchouts : [];
  t.booked = t.booked || {};
  return t;
}
function normItem(it) {
  it.id = it.id || uid();
  it.lat = it.lat == null || it.lat === "" ? NaN : Number(it.lat);
  it.lng = it.lng == null || it.lng === "" ? NaN : Number(it.lng);
  it.cost = Number(it.cost) || 0;
  it.kind = String(it.kind || "activity").toLowerCase();
  it.booked = it.booked === true || it.booked === "true";
  it.anchor = it.anchor === true || it.anchor === "true";
  it.booking = String(it.booking || "none").toLowerCase().replace(/[^a-z]/g, "");
  if (!BOOK.hasOwnProperty(it.booking)) it.booking = "none";
  if (it.transitFromPrev && !Number.isFinite(Number(it.transitFromPrev.minutes))) it.transitFromPrev = null;
  return it;
}

/* ---------- Routing ---------- */
function route() {
  const h = location.hash.replace("#", "");
  S.view = ["plan", "profile", "start", "discover"].includes(h) ? h : (h === "wish" || h === "anchors") ? (DRAFT ? h : "plan") : S.gen ? "gen" : homeView();
  if (S.view === "anchors" && !DRAFT.suggested && !Object.keys(DRAFT.place).length && DRAFT.wish.length) { suggestPlan(false); DRAFT.suggested = true; saveDraft(); }

}
window.addEventListener("hashchange", route);

/* ---------- Render ---------- */
function render(fresh) {
  closeSlot(); hidePickCard();

function routeLink(d) {
  const pts = d.items.filter(it => plotted(it) && it.kind !== "lodging").map(it => it.address || (it.name + ", " + (it.neighborhood || "")));
  if (pts.length < 2) return "";
  const enc = encodeURIComponent;
  const way = pts.slice(1, -1).slice(0, 8).map(enc).join("%7C");
  const url = "https://www.google.com/maps/dir/?api=1&origin=" + enc(pts[0]) + "&destination=" + enc(pts[pts.length - 1]) + (way ? "&waypoints=" + way : "") + "&travelmode=walking";
  return '<a class="btn small" href="' + url + '" target="_blank" rel="noopener">Open day in Google Maps</a>';
}

function stopNumbers(d) {
  let n = 0; const map = {};
  d.items.forEach(it => { if (plotted(it) && it.kind !== "lodging") map[it.id] = ++n; });
  return map;
}

function renderTimeline(d, di) {
  const c = lineVar(di);
  const nums = stopNumbers(d);
  let html = '<div class="timeline" style="--c:' + c + '">';
  d.items.forEach((it, ii) => {
    if (S.who !== "all" && it.who && it.who.length && !it.who.includes(S.who)) return; // someone else's part of the day
    const tr = it.transitFromPrev;
    if (tr && ii > 0) {
      html += '<div class="leg"><span></span><span class="rail-col"></span><span class="txt">' + esc(MODE[tr.mode] || tr.mode || "Travel") + " · " + Math.round(Number(tr.minutes)) + " min</span></div>";
    }
    const minor = it.kind === "transit" || it.kind === "lodging";
    const num = nums[it.id];
    const node = it.kind === "lodging" ? '<span class="node minor home"></span>' : minor ? '<span class="node minor"></span>' : '<span class="node">' + (num || "") + "</span>";
    const cls = "card" + (it.kind === "free" ? " free" : "") + (minor ? " transitk" : "") + (S.hl === it.id ? " hl" : "");
    let body = '<span class="cat">' + esc(it.category || it.kind) + (it.neighborhood ? " · " + esc(it.neighborhood) : "") + "</span>" +
      '<span class="name">' + esc(it.name) + "</span>";
    if (it.why) body += '<span class="why">' + esc(it.why) + "</span>";
    if (it.tip) body += '<span class="tip"><b>Pro tip</b>' + esc(it.tip) + "</span>";
    if (minor && it.booked) body += '<div class="foot"><span class="pill booked">Booked</span></div>';
    if (it.kind === "free" && !S.readOnly) body += '<div class="foot">' + (it.who && it.who.length ? '<span class="pill who">' + esc(it.who.join(" & ")) + "</span>" : "") + '<button class="lnk" data-move="' + ii + '">Move</button><button class="lnk" data-remove="' + ii + '">Remove</button></div>';
    if (!minor) {
      const foot = [];
      if (it.anchor) foot.push('<span class="pill pick">Your pick</span>');
      if (it.who && it.who.length) foot.push('<span class="pill who">' + esc(it.who.join(" & ")) + "</span>");
      if (typeof it.rating === "number") foot.push('<span class="pill">★ ' + it.rating.toFixed(1) + "</span>");
      if (it.gStatus === "CLOSED_PERMANENTLY" || it.gStatus === "CLOSED_TEMPORARILY") foot.push('<span class="pill now">Google lists it as closed</span>');
      else if (it.hours && it.time) { const w = openCheck({ hours: it.hours, minutes: Math.max(15, (toMin(it.end) ?? toMin(it.time) + 60) - toMin(it.time)) }, d.date, toMin(it.time)); if (w) foot.push('<span class="pill daybefore">⚠ ' + esc(w) + "</span>"); }
      if (it.verified === false) foot.push('<span class="pill daybefore">Not found on Google Maps</span>');
      if (it.priceRange && it.priceRange.lo) foot.push('<span class="pill" title="From Google Maps">' + esc(it.costTier || "") + (it.costTier ? " · " : "") + money(it.priceRange.lo) + (it.priceRange.hi ? "–" + money(it.priceRange.hi) : "+") + "/person</span>");
      else if (it.cost) foot.push('<span class="pill"' + (it.priceFrom === "google" ? ' title="Estimated from Google\'s price level"' : "") + ">" + esc(it.costTier || "") + (it.costTier ? " · " : "") + "~" + money(it.cost) + "/person</span>");
      if (it.booked) foot.push('<span class="pill booked">Booked</span>');
      else if (BOOK[it.booking]) foot.push('<span class="pill ' + it.booking + '">' + BOOK[it.booking] + "</span>");
      const q = encodeURIComponent((it.address || it.name + " " + (it.neighborhood || "") + " " + (S.trip.destination || "")).trim());
      foot.push('<a class="lnk" href="' + (it.mapsUrl ? esc(it.mapsUrl) : "https://www.google.com/maps/search/?api=1&query=" + q) + '" target="_blank" rel="noopener">Map</a>');
      foot.push('<a class="lnk" href="' + gcalLink(it, d) + '" target="_blank" rel="noopener">Add to calendar</a>');
      if (!S.readOnly) { foot.push('<button class="lnk" data-move="' + ii + '">Move</button>'); foot.push('<button class="lnk" data-swap="' + ii + '">Change</button>'); foot.push('<button class="lnk" data-remove="' + ii + '">Remove</button>'); }
      body += '<div class="foot">' + foot.join("") + "</div>";
    }
    html += '<div class="stop" data-id="' + it.id + '">' +
      '<span class="time">' + esc(fmtTime(it.time)) + (it.end ? "<small>to " + esc(fmtTime(it.end)) + "</small>" : "") + "</span>" +
      '<span class="rail-col">' + node + "</span>" +
      '<div class="' + cls + '">' + body + "</div></div>";
  });
  return html + "</div>";
}

function gcalLink(it, d) {
  const day = (d.date || "").replace(/-/g, "");
  const t0 = (it.time || "09:00").replace(":", "") + "00";
  const t1 = ((it.end || addMin(it.time || "09:00", 60)) || "10:00").replace(":", "") + "00";
  const details = [it.why, it.tip ? "Pro tip: " + it.tip : ""].filter(Boolean).join("\n\n") + "\n\nPlanned with Mytinerary";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent((it.category ? it.category + ": " : "") + it.name) +
    "&dates=" + day + "T" + t0 + "/" + day + "T" + t1 +
    "&details=" + encodeURIComponent(details) +
    "&location=" + encodeURIComponent(it.address || it.name);
}

function projection(pts, W, H, P) {
  let minLa = Infinity, maxLa = -Infinity, minLo = Infinity, maxLo = -Infinity;
  pts.forEach(p => { minLa = Math.min(minLa, p.lat); maxLa = Math.max(maxLa, p.lat); minLo = Math.min(minLo, p.lng); maxLo = Math.max(maxLo, p.lng); });
  const midLa = (minLa + maxLa) / 2, k = Math.cos(midLa * Math.PI / 180);
  const spanX = Math.max((maxLo - minLo) * k, 0.004), spanY = Math.max(maxLa - minLa, 0.004);
  const sc = Math.min((W - 2 * P) / spanX, (H - 2 * P) / spanY);
  const ox = (W - spanX * sc) / 2, oy = (H - spanY * sc) / 2;
  const cx = (minLo + maxLo) / 2;
  const X = lng => ox + ((lng - cx) * k + spanX / 2) * sc;
  const Y = lat => oy + (maxLa - lat) * sc;
  return { X, Y, sc };
}

/* Map: no basemap tiles are allowed in the page, so stops are projected onto a plain grid, like a transit diagram. */
function renderMap(t) {
  if (GMAPS_KEY) {
    const d = t.days[S.day], nums = stopNumbers(d), col = lineVar(S.day);
    const ps = d.items.filter(it => plotted(it) && it.kind !== "lodging" && !(S.who !== "all" && it.who && it.who.length && !it.who.includes(S.who)));
    const hb = t.homeBase;
    return mapSlotHTML("Day " + (S.day + 1) + " map <small>numbers match the stops</small>",
      '<span style="--c:' + col + '"><i></i>Day ' + (S.day + 1) + '</span><span><i style="background:var(--ink);width:10px;height:10px"></i>' + esc(hb.name || "Home base") + "</span>",
      { points: ps.map(it => ({ id: it.id, lat: it.lat, lng: it.lng, label: String(nums[it.id] || ""), color: col, filled: true, title: it.name })), paths: [{ color: col, pts: ps }],
        home: hasLL(hb) ? { lat: hb.lat, lng: hb.lng, name: hb.name } : null,
        onPick: id => { const el = document.querySelector('.stop[data-id="' + id + '"]'); if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.querySelector(".card").classList.add("hl"); } highlightPin(id); } });
  }
  const pts = [];
  const hb = t.homeBase;
  if (Number.isFinite(hb.lat) && Number.isFinite(hb.lng)) pts.push({ lat: hb.lat, lng: hb.lng });
  t.days.forEach(d => d.items.forEach(it => { if (plotted(it)) pts.push(it); }));
  if (pts.length < 2) return "";
  const W = 600, H = 440, P = 40;
  const { X, Y, sc } = projection(pts, W, H, P);
  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Map of stops by day">';
  for (let gx = 0; gx <= W; gx += 40) svg += '<line class="gridl" x1="' + gx + '" y1="0" x2="' + gx + '" y2="' + H + '"/>';
  for (let gy = 0; gy <= H; gy += 40) svg += '<line class="gridl" x1="0" y1="' + gy + '" x2="' + W + '" y2="' + gy + '"/>';
  // scale bar: km per px
  const kmPerDegLat = 111.32;
  const kmPerPx = kmPerDegLat / sc;
  const nice = [0.25, 0.5, 1, 2, 5, 10, 20, 50, 100, 200];
  let km = nice.find(n => n / kmPerPx >= 70) || 200;
  const bar = km / kmPerPx;
  svg += '<g transform="translate(' + (W - P - bar) + "," + (H - 18) + ')"><line x1="0" y1="0" x2="' + bar + '" y2="0" stroke="var(--ink)" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="4" stroke="var(--ink)" stroke-width="2"/><line x1="' + bar + '" y1="-4" x2="' + bar + '" y2="4" stroke="var(--ink)" stroke-width="2"/><text x="' + (bar / 2) + '" y="-8" text-anchor="middle">' + km + " km · " + (Math.round(km * 0.621 * 10) / 10) + " mi</text></g>";
  svg += '<g transform="translate(24,30)"><text x="0" y="0" text-anchor="middle" style="font-weight:600;fill:var(--ink)">N</text><path d="M0 6 L5 20 L0 16 L-5 20 Z" fill="var(--ink)"/></g>';
  const order = t.days.map((_, i) => i).filter(i => i !== S.day).concat([S.day]);
  order.forEach(di => {
    const d = t.days[di];
    const ps = d.items.filter(it => plotted(it) && it.kind !== "lodging");
    const sel = di === S.day;
    const col = lineVar(di);
    if (ps.length > 1) {
      svg += '<polyline fill="none" stroke="' + col + '" stroke-width="' + (sel ? 6 : 3) + '" stroke-linejoin="round" stroke-linecap="round" opacity="' + (sel ? 1 : 0.22) + '" points="' + ps.map(p => X(p.lng).toFixed(1) + "," + Y(p.lat).toFixed(1)).join(" ") + '"/>';
    }
    if (sel) {
      const nums = stopNumbers(d);
      ps.forEach(p => {
        const x = X(p.lng), y = Y(p.lat), on = S.hl === p.id;
        svg += '<g class="stop-c" data-id="' + p.id + '"><title>' + esc(p.name) + '</title><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (on ? 14 : 11) + '" fill="var(--card)" stroke="' + col + '" stroke-width="4"/>' +
          '<text x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="middle" style="fill:var(--ink);font-weight:600">' + nums[p.id] + "</text></g>";
      });
    } else {
      ps.forEach(p => { svg += '<circle cx="' + X(p.lng).toFixed(1) + '" cy="' + Y(p.lat).toFixed(1) + '" r="3.5" fill="' + col + '" opacity="0.35"/>'; });
    }
  });
  if (Number.isFinite(hb.lat)) {
    const x = X(hb.lng), y = Y(hb.lat);

function renderBookings(t) {
  const groups = { booked: [], now: [], daybefore: [], walkin: [] };
  if (t.homeBase.name) groups[t.homeBase.booked ? "booked" : "now"].push({ id: "home", name: t.homeBase.name, day: "Stay" });
  t.days.forEach((d, di) => d.items.forEach(it => {
    const g = it.booked ? "booked" : it.booking;
    if (groups[g]) groups[g].push({ id: it.id, name: it.name, day: "Day " + (di + 1) });
  }));
  const meta = { booked: ["Already booked", "var(--good)"], now: ["Book now", "var(--accent)"], daybefore: ["Book the day before", "var(--warn)"], walkin: ["Walk in, no reservation", "var(--muted)"] };
  const total = groups.now.length + groups.daybefore.length;
  const done = groups.now.concat(groups.daybefore).filter(x => t.booked[x.id]).length;
  let html = '<section class="panel"><h3>What to book <small>' + done + " of " + total + " done</small></h3>";
  Object.keys(groups).forEach(k => {
    if (!groups[k].length) return;
    html += '<div class="bk-group"><span class="bk-label"><span class="sw" style="background:' + meta[k][1] + '"></span>' + meta[k][0] + "</span>";
    groups[k].forEach(x => {
      if (k === "booked") html += '<div class="bk done"><span style="color:var(--good)">✓</span><span>' + esc(x.name) + "</span><em>" + x.day + "</em></div>";

      else html += '<label class="bk' + (t.booked[x.id] ? " done" : "") + '"><input type="checkbox" data-book="' + x.id + '"' + (t.booked[x.id] ? " checked" : "") + "><span>" + esc(x.name) + "</span><em>" + x.day + "</em></label>";
    });

function renderBudget(t) {
  const target = BUDGET_TARGET[t.budget] || 300;
  const rooms = Math.ceil(t.travelers / 2);
  const lodgePP = (t.homeBase.nightly || 0) * rooms / t.travelers;
  const rows = t.days.map((d, i) => {
    const food = d.items.filter(isMeal).reduce((a, it) => a + it.cost, 0);
    const act = d.items.filter(it => !isMeal(it)).reduce((a, it) => a + it.cost, 0);
    const lodge = i < t.days.length - 1 || t.days.length === 1 ? lodgePP : 0;
    return { lodge, food, act, total: lodge + food + act };
  });
  const max = Math.max(target * 1.25, ...rows.map(r => r.total));
  const avg = rows.reduce((a, r) => a + r.total, 0) / rows.length;
  const trip = rows.reduce((a, r) => a + r.total, 0);
  const diff = avg - target;
  const verdict = Math.abs(diff) < target * 0.08 ? "right on budget" : diff > 0 ? money(diff) + " over your " + money(target) + " target" : money(-diff) + " under your " + money(target) + " target";
  let html = '<section class="panel"><h3>Budget check <small>per person, before flights</small></h3>' +
    '<div class="bud-sum"><strong>' + money(avg) + '<span class="small muted" style="font-family:var(--body);font-weight:400"> / day</span></strong>' + esc(verdict) + " · " + money(trip) + " for the trip</div>";
  rows.forEach((r, i) => {
    const w = v => (v / max * 100).toFixed(1) + "%";
    html += '<div class="bud-row"><span class="lab">Day ' + (i + 1) + '</span><div class="bar" title="Lodging ' + money(r.lodge) + ", food " + money(r.food) + ", activities " + money(r.act) + '">' +
      '<span style="width:' + w(r.lodge) + ';background:var(--ink)"></span><span style="width:' + w(r.food) + ';background:' + lineVar(0) + '"></span><span style="width:' + w(r.act) + ';background:' + lineVar(1) + '"></span>' +
      '<span class="target" style="left:' + w(target) + '"></span></div><span class="amt">' + money(r.total) + "</span></div>";
  });
  html += '<div class="bud-key"><span><i style="background:var(--ink)"></i>Lodging</span><span><i style="background:' + lineVar(0) + '"></i>Food &amp; drink</span><span><i style="background:' + lineVar(1) + '"></i>Activities</span><span><i style="background:var(--ink);width:2px"></i>Target</span></div>';
  return html + "</section>";
}

function copyText() {

}

  if (!q) { toast("Add a time, like \"8:30pm start bedtime routine\"."); return false; }
  const t = S.trip, d = t.days[S.day];
  d.items.push(normItem({ time: q.time, end: toHM(toMin(q.time) + 30), kind: "free", category: "Your plan", name: q.name, who: S.who !== "all" ? [S.who] : [] }));
  d.items.sort((a, b) => (toMin(a.time) ?? 0) - (toMin(b.time) ?? 0));
  markEdited(t); saveTrip(t); render();
  toast("Added " + q.name + " at " + fmtTime(q.time) + ".");
  return true;
}

// Someone opened /t/<token>: show that trip read-only, with a way in for people who aren't using Mytinerary yet.

/* ---------- Swap a stop ---------- */
let swapCtl = null;
function tripContext(t) {
  const p = t.prefs;
  return (p ? prefsText(p) : "Destination: " + t.destination + "\nTravelers: " + t.travelers + " · Pace: " + t.pace + " · Budget: " + t.budget) +
    "\nHome base: " + (t.homeBase.name || "") + " (" + (t.homeBase.neighborhood || "") + ")";
}
function dayList(d) { return d.items.map((it, i) => i + ". " + it.time + "-" + (it.end || "") + " " + (it.category || it.kind) + ": " + it.name + " (" + (it.neighborhood || "") + ")").join("\n"); }
function openDrawer(eyebrow, title, sub) {

$("#drawerClose").addEventListener("click", closeDrawer);
$("#drawerBg").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// Changing a stop starts with why, so the alternatives actually fix the problem.
function openSwap(di, ii) {
  const t = S.trip, d = t.days[di], it = d.items[ii];
  openDrawer("Change a stop · Day " + (di + 1), it.name, (it.category || "") + " · " + fmtTime(it.time) + (it.end ? " to " + fmtTime(it.end) : ""));

  if (!sampleFn) { body.innerHTML = '<p class="small">Changing stops needs Claude, which is available when this page is open on claude.ai.</p>'; return; }
  const reasons = isMeal(it) ? ["Something cheaper", "Grab and go", "Closer by", "Kid-friendly", "Better reviewed", "A different cuisine"] : ["Something cheaper", "Closer by", "Indoors", "Kid-friendly", "Shorter", "Something different"];

async function swapOptions(di, ii, why) {
  const t = S.trip, d = t.days[di], it = d.items[ii], body = $("#drawerBody");
  body.innerHTML = '<p class="gen-status">Finding three options' + (why ? " (" + esc(why.toLowerCase()) + ")" : "") + " that fit this slot…</p>";
  swapCtl = new AbortController();
  const prompt = "You help Mytinerary travelers swap one stop in their itinerary.\n\nTRIP\n" + tripContext(t) +
    "\n\nDAY " + (di + 1) + " (" + d.date + ") CURRENT PLAN\n" + dayList(d) +
    (why ? "\n\nWHY THEY WANT TO CHANGE IT: " + why + ". Every option must clearly fix this." : "") +
    "\n\nReplace item " + ii + " (" + it.name + "). Suggest 3 different real, well-established alternatives of the same kind (" + (it.category || it.kind) + ") that fit the same time slot, stay close to the previous and next stops, match the traveler's budget and interests, and are not already in the plan. Vary them: one safe pick, one local favorite, one wildcard.\n" +
    "Reply with ONLY a JSON array of 3 objects, each shaped like:\n" + ITEM_SHAPE + "\nKeep time=\"" + it.time + "\" and end=\"" + (it.end || "") + "\". transitFromPrev is from the previous stop in the list.";
  try {
    const arr = await sampleFn.json(prompt, { signal: swapCtl.signal, modelTier: "default", cache: false });
    const alts = (Array.isArray(arr) ? arr : []).slice(0, 3).map(normItem);
    alts.forEach(a => { a.who = it.who || []; a.anchor = false; });
    if (PLACES) { const res = await placesMatch(t.destination, alts); if (res) alts.forEach((a, k) => applyPlace(a, res[k])); }
    const open = alts.filter(a => !closedOnGoogle(a)); if (open.length) alts.splice(0, alts.length, ...open);
    if (!alts.length) throw { code: "invalid_json" };
    body.innerHTML = alts.map((a, k) => '<button class="alt" data-k="' + k + '"><span class="cat">' + esc(a.category || "") + (a.neighborhood ? " · " + esc(a.neighborhood) : "") + '</span><span class="name" style="font-family:var(--display);font-weight:600;font-size:18px">' + esc(a.name) + '</span><span class="small">' + esc(a.why || "") + '</span><span class="foot">' + (a.cost ? '<span class="pill">' + esc(a.costTier || "") + " ~" + money(a.cost) + "</span> " : "") + (BOOK[a.booking] ? '<span class="pill ' + a.booking + '">' + BOOK[a.booking] + "</span>" : "") + "</span></button>").join("") +
      '<p class="note">Pick one to replace ' + esc(it.name) + ".</p>";
    body.querySelectorAll(".alt").forEach(b => b.addEventListener("click", () => {
      const a = alts[+b.dataset.k];
      if (ii === 0) a.transitFromPrev = null;
      d.items[ii] = a; markEdited(t); saveTrip(t); closeDrawer(); render();
      toast("Swapped in " + a.name);
    }));
  } catch (e) {
    if (e && e.code === "cancelled") return;
    if (e && e.code === "not_granted") sampleBlocked = true;
    body.innerHTML = '<p class="err">' + esc(genErrorCopy(e)) + "</p>";
  }
}
